<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#0d1020;--panel:#171b33ee;--ink:#eef1ff;--dim:#a8b0d8;--accent:__ACCENT__;--good:#3ddc84;--bad:#ff6b6b;--gold:#ffd166}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:18px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
#scene{position:fixed;inset:0;z-index:0}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:16px;min-height:100%;display:flex;flex-direction:column;gap:12px}
.hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel);border-radius:14px;padding:10px 14px}
.hud b{color:var(--gold)}
.bar{flex:1 1 160px;height:12px;background:#ffffff22;border-radius:8px;overflow:hidden;min-width:120px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .4s}
.card{background:var(--panel);border-radius:18px;padding:20px;box-shadow:0 10px 40px #0008}
.topic{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
h1{margin:.2em 0;font-size:30px} h2{margin:.3em 0 .6em;font-size:23px}
.choices{display:grid;gap:10px}
button{font:inherit;color:var(--ink);background:#ffffff14;border:2px solid #ffffff22;border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;transition:transform .08s,background .2s}
button:hover:not(:disabled){background:#ffffff26;transform:translateY(-1px)}
button:disabled{cursor:default}
button.right{border-color:var(--good);background:#3ddc8433}
button.wrong{border-color:var(--bad);background:#ff6b6b33}
.go{background:var(--accent);border-color:transparent;font-weight:700;text-align:center;color:#0d1020}
input[type=text]{font:inherit;width:100%;padding:12px;border-radius:12px;border:2px solid #ffffff33;background:#0006;color:var(--ink)}
.fb{margin-top:14px;padding:14px;border-radius:12px;display:none}
.fb.ok{display:block;background:#3ddc8422;border-left:5px solid var(--good)}
.fb.no{display:block;background:#ff6b6b22;border-left:5px solid var(--bad)}
.fb strong{font-size:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.row>button{flex:1}
.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:34px;font-weight:800;color:var(--gold);text-shadow:0 2px 12px #000;pointer-events:none;z-index:5;animation:pop 1s forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}
.timer i{background:linear-gradient(90deg,var(--bad),var(--gold));transition:width .25s linear}
.boss{border:2px solid var(--bad)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
ul.rev{padding-left:20px} ul.rev li{margin:6px 0}
.scene{font-style:italic;background:#0005;border-left:4px solid var(--accent);border-radius:8px;padding:8px 12px;margin:8px 0}
.small{font-size:14px;color:var(--dim)}
.hero{display:flex;gap:12px;align-items:center;background:#ffffff0d;border-radius:12px;padding:10px;margin-top:10px}.hero .big{font-size:40px}
button.struck{opacity:.35;text-decoration:line-through}
a{color:var(--accent)}
.stage{position:relative;height:150px;border-radius:12px;overflow:hidden;margin:8px 0;background:linear-gradient(#0000,#0006),var(--sky,#1a2a3a)}
.stage .gnd{position:absolute;left:0;right:0;bottom:0;height:34px;background:var(--gnd,#2d5a2a)}
.stage .ha{position:absolute;left:12%;bottom:18px;width:96px;height:120px;transition:transform .35s}
.stage .foe{position:absolute;right:14%;bottom:24px;font-size:70px;line-height:1;transition:transform .35s,opacity .5s,filter .3s}
.stage .fx{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-size:26px;font-weight:800;text-shadow:0 2px 8px #000;opacity:0}
.stage.win .ha{transform:translateX(150%)}.stage.win .foe{transform:translate(60px,-30px) rotate(35deg);opacity:0}
.stage.win .fx{color:var(--gold);animation:fxup 1.6s forwards}.stage.lose .fx{color:var(--bad);animation:fxup 1.6s forwards}
.stage.lose .foe{animation:lunge .5s}.stage.lose .ha{animation:hurt .6s;filter:drop-shadow(0 0 10px #f33)}
@keyframes fxup{0%{opacity:0;top:40%}20%{opacity:1}80%{opacity:1}100%{opacity:0;top:5%}}
@keyframes lunge{50%{transform:translateX(-160px) scale(1.2)}}
@keyframes hurt{20%,60%{transform:translateX(-14px) rotate(-8deg)}40%,80%{transform:translateX(6px)}}
.wait{opacity:.55}
.inv{display:flex;flex-wrap:wrap;gap:6px}.inv span{background:#ffffff14;border-radius:8px;padding:3px 8px;font-size:14px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}.opts button{padding:6px 10px;font-size:15px}.opts button.sel{border-color:var(--gold);background:#ffd16633}
.sw{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:middle;border:1px solid #fff6}
.step{border:2px dashed var(--gold)}
@media (max-width:520px){html,body{font-size:16px}h2{font-size:20px}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DECK = __DECK__;
/*__KIT__*/
// ---------- storage ----------
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const KEY='studywright:'+DECK.id, HKEY='studywright:heroes', RKEY='studywright:records';
const STAT=DECK.stat||String(DECK.subject).split(':')[0].trim()||'Study';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return String(s).toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function lev(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]}
function typedOk(q,v){const n=norm(v);if(!n)return false;return q.accept.some(a=>{const t=norm(a);return n===t||(t.length>4&&lev(n,t)<=Math.floor(t.length/5))})}
// ---------- hero (persists across every studywright game in this browser) ----------
const CLASSES={Scholar:{icon:'📜',feat:'scribe'},Ranger:{icon:'🏹',feat:'keen'},Knight:{icon:'🛡️',feat:'wind'},Mage:{icon:'🔮',feat:'focus'}};
const FEATS={keen:{name:'Keen Eye',desc:'Once per quest, strike out one wrong choice.'},
 wind:{name:'Second Wind',desc:'Your first miss each quest does not break your streak.'},
 scribe:{name:'Scribe',desc:'+5 XP for every typed answer you get right.'},
 grit:{name:'Grit',desc:'+10 XP when you finally get a question you missed. Mistakes make you stronger.'},
 focus:{name:'Battle Focus',desc:'Gold streaks start at 2 in a row instead of 3.'},
 sage:{name:'Sage',desc:'+3 XP per right answer in one study area (needs that area at level 3).',area:true}};
const H={all(){return store.get(HKEY)||{active:null,list:[]}},save(d){store.set(HKEY,d)},
 cur(){const d=H.all();return fixHero(d.list.find(h=>h.id===d.active)||null)},
 put(h){const d=H.all();const i=d.list.findIndex(x=>x.id===h.id);if(i<0)d.list.push(h);else d.list[i]=h;d.active=h.id;H.save(d)}};
const need=L=>50*L*(L+1); // total XP needed to reach level L+1
function heroLvl(h){let L=1;while(h.xp>=need(L))L++;return L}
function area(h,s){const a=h.areas[s]||{use:0,train:0};return{...a,lvl:Math.floor(a.use/15)+a.train}}
function hasFeat(h,f){return !!h&&h.feats.includes(f)}
function featName(f){const[b,ar]=f.split(':');return FEATS[b].name+(ar?' ('+esc(ar)+')':'')}
// ---------- looks and inventory: every build draws a different hero ----------
const LOOK={skin:['#f6d3b3','#e0ac7e','#b9794f','#8a5233','#5c3820'],
 hair:{Black:'#1c1c22',Brown:'#5a3418',Blond:'#e6c35c',Red:'#b8401c',Silver:'#d8dce6',Blue:'#3a7bd5'},
 style:['Short','Long','Spiky','Bun','Bald'],
 outfit:{Teal:'#2bb3a8',Crimson:'#c0304a',Forest:'#3b8a3e',Royal:'#4a5bd8',Gold:'#d9a520',Violet:'#8a4fd0',Charcoal:'#4a4f5a'},
 gear:{Scholar:['Quill','Lantern','Tome'],Ranger:['Bow','Spear','Slingshot'],Knight:['Sword','Hammer','Lance'],Mage:['Staff','Wand','Orb']},
 pet:['None','Owl','Fox','Cat','Dragonling','Frog']};
const PETI={Owl:'🦉',Fox:'🦊',Cat:'🐈',Dragonling:'🐉',Frog:'🐸'};
const KIT={Scholar:['📜 Map of the Realms','🕯️ Candle'],Ranger:['🪢 Rope','🧭 Compass'],Knight:['🛡️ Shield','🍖 Trail Rations'],Mage:['🔮 Crystal','📖 Spellbook']};
const LOOT=['🧪 Healing Potion','🧪 Healing Potion','💎 Gem','🪶 Lucky Feather','🗝️ Old Key','🍎 Apple','🧿 Charm','🪙 Silver Coin','🦴 Fossil','🌰 Strange Seed'];
function defLook(h){const n=[...h.name].reduce((a,c)=>a+c.charCodeAt(0),0);const pick=(a,k)=>a[(n+k)%a.length];return{skin:pick(LOOK.skin,1),hair:pick(Object.keys(LOOK.hair),2),style:pick(LOOK.style,3),outfit:pick(Object.keys(LOOK.outfit),4),gear:LOOK.gear[h.cls][0],pet:'None'}}
function fixHero(h){if(!h)return h;h.look=h.look||defLook(h);if(!h.inv)h.inv={gold:10,hp:maxHp(h),items:KIT[h.cls].concat(['🧪 Healing Potion'])};return h}
const maxHp=h=>h.cls==='Knight'?12:10;
function avatar(h,w=96){return Kit.img(h,w)}
function avatarSvg(h,w=96){const L=h.look||defLook(h),sk=L.skin,hr=LOOK.hair[L.hair]||'#333',of=LOOK.outfit[L.outfit]||'#888';
 const hair=L.style==='Bald'?'':L.style==='Long'?`<path d="M30 40 Q48 10 66 40 L70 78 L62 78 L62 44 L34 44 L34 78 L26 78Z" fill="${hr}"/>`:L.style==='Spiky'?`<path d="M30 40 L32 22 L40 32 L44 16 L50 30 L56 16 L60 32 L66 22 L66 40Z" fill="${hr}"/>`:L.style==='Bun'?`<circle cx="48" cy="18" r="8" fill="${hr}"/><path d="M30 42 Q48 16 66 42Z" fill="${hr}"/>`:`<path d="M30 42 Q48 16 66 42 L66 36 Q48 26 30 36Z" fill="${hr}"/>`;
 const hat=h.cls==='Mage'?`<path d="M28 34 L48 -2 L68 34Z" fill="${of}"/><circle cx="48" cy="2" r="3" fill="#ffd166"/>`:h.cls==='Knight'?`<path d="M31 40 Q48 14 65 40 L65 46 L31 46Z" fill="#c0c8d8"/><rect x="46" y="18" width="4" height="12" fill="${of}"/>`:h.cls==='Ranger'?`<path d="M28 44 Q48 6 68 44 L64 46 Q48 22 32 46Z" fill="#3a5a2a"/>`:`<rect x="32" y="22" width="32" height="6" fill="#222"/><path d="M26 22 L48 14 L70 22 L48 28Z" fill="#222"/>`;
 const gi={Quill:`<path d="M80 60 L92 30" stroke="#eee" stroke-width="4"/>`,Lantern:`<rect x="78" y="62" width="12" height="16" rx="2" fill="#ffd166" stroke="#553" stroke-width="2"/>`,Tome:`<rect x="76" y="64" width="16" height="20" fill="#7a2a2a" stroke="#ffd166"/>`,
  Bow:`<path d="M84 40 Q100 70 84 100" stroke="#8a5a2a" stroke-width="4" fill="none"/><line x1="84" y1="40" x2="84" y2="100" stroke="#ddd"/>`,Spear:`<line x1="86" y1="30" x2="86" y2="110" stroke="#8a5a2a" stroke-width="4"/><path d="M80 34 L86 18 L92 34Z" fill="#ccc"/>`,Slingshot:`<path d="M86 96 L86 76 L80 64 M86 76 L92 64" stroke="#8a5a2a" stroke-width="4" fill="none"/>`,
  Sword:`<line x1="86" y1="30" x2="86" y2="84" stroke="#dde" stroke-width="5"/><line x1="78" y1="80" x2="94" y2="80" stroke="#b08d3a" stroke-width="4"/>`,Hammer:`<line x1="86" y1="44" x2="86" y2="96" stroke="#8a5a2a" stroke-width="4"/><rect x="74" y="34" width="24" height="12" fill="#999"/>`,Lance:`<path d="M84 110 L86 12 L90 110Z" fill="#ccd"/>`,
  Staff:`<line x1="86" y1="26" x2="86" y2="112" stroke="#8a5a2a" stroke-width="4"/><circle cx="86" cy="24" r="7" fill="#7cf"/>`,Wand:`<line x1="80" y1="74" x2="94" y2="52" stroke="#eee" stroke-width="3"/><circle cx="94" cy="52" r="3" fill="#ffd166"/>`,Orb:`<circle cx="86" cy="66" r="9" fill="#b388ff" stroke="#fff"/>`}[L.gear]||'';
 const pet=PETI[L.pet]?`<text x="2" y="118" font-size="24">${PETI[L.pet]}</text>`:'';
 return `<svg viewBox="-4 -6 104 128" width="${w}" height="${w*1.25}" class="avatar"><rect x="34" y="78" width="10" height="30" fill="#333"/><rect x="52" y="78" width="10" height="30" fill="#333"/><path d="M28 50 Q48 44 68 50 L72 84 L24 84Z" fill="${of}"/><rect x="24" y="74" width="48" height="5" fill="#0005"/><rect x="68" y="54" width="10" height="24" rx="4" fill="${of}"/><circle cx="76" cy="76" r="5" fill="${sk}"/><rect x="18" y="54" width="10" height="24" rx="4" fill="${of}"/>${hair}<circle cx="48" cy="38" r="14" fill="${sk}"/><circle cx="43" cy="37" r="1.8" fill="#222"/><circle cx="53" cy="37" r="1.8" fill="#222"/><path d="M43 44 Q48 47 53 44" stroke="#522" fill="none"/>${hat}${gi}${pet}</svg>`}
function invStr(h){return `<div class="inv">${h.inv.items.map(i=>`<span>${esc(i)}</span>`).join('')||'<span>empty</span>'}</div>`}
function newHero(name,cls,look){const h={id:'h'+Date.now().toString(36),name,cls,xp:0,areas:{},feats:[CLASSES[cls].feat],picks:0,created:new Date().toISOString(),quests:0,look};fixHero(h);h.inv.items.unshift('⚔️ '+look.gear);if(PETI[look.pet])h.inv.items.push(PETI[look.pet]+' '+look.pet+' (pet)');return h}
const goldAt=()=>hasFeat(H.cur(),'focus')?2:3;
// ---------- realms: each subject is a world; each question is a challenge the hero overcomes ----------
const REALMS={
 history:{name:'The Frontier of Ages',icon:'🏜️',sky:0x2a1a12,fog:0xb8794a,ground:0xa0663a,prop:'mission',obstacle:'gate',foes:['🚪','💂','🌊','✉️','🗺️','🌪️','🏰'],
  c:[['{h} reaches a mission gate barred shut. The old padre will lift the bar only for someone who knows <b>{t}</b>.','The bar lifts and the gate creaks open. {h} rides on.','The padre shakes his head. The gate stays shut for now.'],
   ['A Spanish patrol stops {h} on the Camino Real. The captain wants proof that {h} is no filibuster: a question about <b>{t}</b>.','The captain salutes and waves {h} through.','The captain frowns. {h} must circle back and try again.'],
   ['A flooded river blocks the trail. The ferryman only takes travelers who can answer him about <b>{t}</b>.','The ferry pushes off. {h} crosses the river.','The ferryman pushes back from the bank. The river waits.'],
   ['A rider brings a sealed letter, but the seal is a riddle about <b>{t}</b>.','The seal cracks open. The message speeds {h} forward.','The seal will not break. Better learn it and come back.'],
   ['An old map is torn in two. The missing half is found only by knowing <b>{t}</b>.','The map pieces fit. {h} finds the next trail.','The map stays torn. The trail is hidden for now.'],
   ['A dust storm rolls across the plains. A traveler at the campfire offers shelter in trade for knowledge of <b>{t}</b>.','The storm howls past while {h} rests safe by the fire.','The storm drives {h} back a mile. It will come round again.'],
   ['A fort commander will open the armory only to someone who knows <b>{t}</b>.','The armory doors swing wide. {h} gears up.','The doors stay locked. The commander will ask again later.']]},
 biology:{name:'The Living Wilds',icon:'🌿',sky:0x0b2418,fog:0x2f7a4a,ground:0x2d5a2a,prop:'tree',obstacle:'vine',foes:['🌿','🪲','🐦','🚪','🦟','🌳'],
  c:[['A wall of thorny vines grows across the jungle path. The vines wither only before someone who knows <b>{t}</b>.','The vines shrivel and part. {h} pushes deeper into the wilds.','The vines tighten. They will test {h} again soon.'],
   ['A giant beetle guards a rotting log bridge. It clicks a question about <b>{t}</b>.','The beetle steps aside. {h} crosses the log.','The beetle snaps its jaws. {h} backs away for now.'],
   ['The island finches will only sing the way forward to one who understands <b>{t}</b>.','The finches burst into song and show {h} the path.','The finches fall silent. Ask them again later.'],
   ['A hidden field lab sits upriver. Its door opens for knowledge of <b>{t}</b>.','The lab door hisses open. {h} gathers new samples.','The door stays sealed. {h} paddles back downstream.'],
   ['A swarm of mosquitoes rises from the swamp. Only knowing <b>{t}</b> will keep them off.','The swarm drifts away. {h} wades through the swamp.','The swarm buzzes closer. {h} retreats to try again.'],
   ['An ancient tree spirit blocks the trail and asks about <b>{t}</b>.','The spirit smiles and the roots lift into a bridge.','The roots stay tangled. The spirit will ask again.']]},
 math:{name:'The Clockwork Spires',icon:'⚙️',sky:0x10152a,fog:0x46507a,ground:0x55607a,prop:'gear',obstacle:'lock',foes:['🔒','🌉'],
  c:[['A clockwork lock holds a tower door shut. Its dials turn only for the right answer about <b>{t}</b>.','The gears click into place. The door swings open.','The gears grind and jam. They will reset soon.'],
   ['A bridge of floating number-stones is missing a stone: <b>{t}</b>.','The stone glows into place. {h} crosses.','The gap stays open. {h} steps back.']]},
 science:{name:'The Storm Laboratory',icon:'⚗️',sky:0x0e1030,fog:0x4a3a8a,ground:0x3a3560,prop:'crystal',obstacle:'orb',foes:['⚡','🤖'],
  c:[['A crackling energy barrier blocks the lab hall. It powers down only for someone who knows <b>{t}</b>.','The barrier fizzles out. {h} walks through.','The barrier sparks brighter. Try again soon.'],
   ['A runaway robot asks a question about <b>{t}</b> before it will stand down.','The robot powers down politely.','The robot whirs on. It will ask again.']]},
 words:{name:'The Library of Echoes',icon:'📚',sky:0x1a1028,fog:0x6a4a7a,ground:0x5a3a4a,prop:'book',obstacle:'gate',foes:['📕'],
  c:[['A talking book blocks the stairs and will move only for someone who knows <b>{t}</b>.','The book flutters aside. {h} climbs higher.','The book snaps shut. It will ask again later.']]},
 quest:{name:'The Endless Tower',icon:'🏰',sky:0x0d1020,fog:0x0d1020,ground:0x2a2f55,prop:'crystal',obstacle:'orb',
  c:[['A guardian blocks the next floor of the tower and asks about <b>{t}</b>.','The guardian steps aside. {h} climbs on.','The guardian holds firm. It will ask again soon.']]}};
const RID=DECK.realm||(()=>{const s=(DECK.subject+' '+DECK.title).toLowerCase();return /hist|texas|war|civics|government|social/.test(s)?'history':/bio|evolution|selection|cell|life|ecolog|genet/.test(s)?'biology':/math|algebra|geometr|fraction|number/.test(s)?'math':/science|chem|physic|earth|space/.test(s)?'science':/english|reading|spelling|grammar|vocab|language/.test(s)?'words':'quest'})();
const REALM=REALMS[RID]||REALMS.quest;
const fill=(x,h,t)=>x.replace(/\{h\}/g,'<b>'+esc(h)+'</b>').replace(/\{t\}/g,esc(t||'this'));
function chal(qi){const q=DECK.questions[qi];const k=(qi*7+3)%REALM.c.length;const foe=q.foe||(REALM.foes||[])[q.scene?0:k]||REALM.icon;if(q.scene)return[q.scene,q.win||REALM.c[0][1],q.lose||REALM.c[0][2],foe];return[...REALM.c[k],foe]}
const hex=n=>'#'+n.toString(16).padStart(6,'0');
// a queue entry is a question index, or {p,s} for step s of question p (asked after a first miss)
function itemOf(e){if(typeof e==='number'){const b=DECK.questions[e];const n=S.asks[e]||0;const vs=b.variants||[];const v=n>0&&vs.length?vs[(n-1)%vs.length]:null;return{qi:e,q:v?{...b,...v,type:v.type||(v.accept?'type':'mc')}:b,step:false}}
 const b=DECK.questions[e.p];return{qi:e.p,q:{topic:b.topic,explain:b.explain,...b.steps[e.s]},step:true,k:e.s,n:b.steps.length}}
const rnd=(a,b)=>a+(Math.random()*(b-a+1)|0);
function outcome(h,ok,gold,boss,foe){const I=h.inv;const out=[];
 if(ok){const g=rnd(2,4)+(gold?2:0);I.gold+=g;out.push('+'+g+' 🪙');if(Math.random()<.22){const it=LOOT[rnd(0,LOOT.length-1)];I.items.push(it);out.push('found '+it)}if(I.hp<maxHp(h)&&Math.random()<.3){I.hp++;out.push('+1 ❤️')}}
 else{if(boss||I.gold<1||Math.random()<.6){const d=boss?1:rnd(1,3);I.hp=Math.max(0,I.hp-d);out.push(foe+' hits! −'+d+' ❤️')}else{const g=Math.min(I.gold,rnd(1,4));I.gold-=g;out.push('dropped '+g+' 🪙 running away')}
  const pi=I.items.indexOf('🧪 Healing Potion');if(I.hp<=3&&I.hp>0&&pi>=0){I.items.splice(pi,1);I.hp=Math.min(maxHp(h),I.hp+5);out.push('drank a 🧪 potion: +5 ❤️')}
  if(I.hp<=0){const g=Math.min(I.gold,5);I.gold-=g;I.hp=maxHp(h);out.push('fainted! Woke at camp, healed, −'+g+' 🪙')}}
 return out}
// ---------- run ----------
