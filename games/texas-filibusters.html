<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Texas Test Prep</title>
<style>
:root{--bg:#0d1020;--panel:#171b33ee;--ink:#eef1ff;--dim:#a8b0d8;--accent:#ff9f43;--good:#3ddc84;--bad:#ff6b6b;--gold:#ffd166}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:18px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
#scene{position:fixed;inset:0;z-index:0}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:16px;min-height:100%;display:flex;flex-direction:column;gap:12px}
.hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel);border-radius:14px;padding:10px 14px}
.hud b{color:var(--gold)}
.bar{flex:1 1 160px;height:12px;background:#ffffff22;border-radius:8px;overflow:hidden;min-width:120px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .4s}
.card{background:var(--panel);border-radius:18px;padding:20px;box-shadow:0 10px 40px #0008}
.topic{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
h1{margin:.2em 0;font-size:30px} h2{margin:.3em 0 .6em;font-size:23px}
.choices{display:grid;gap:10px}
button{font:inherit;color:var(--ink);background:#ffffff14;border:2px solid #ffffff22;border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;transition:transform .08s,background .2s}
button:hover:not(:disabled){background:#ffffff26;transform:translateY(-1px)}
button:disabled{cursor:default}
button.right{border-color:var(--good);background:#3ddc8433}
button.wrong{border-color:var(--bad);background:#ff6b6b33}
.go{background:var(--accent);border-color:transparent;font-weight:700;text-align:center;color:#0d1020}
input[type=text]{font:inherit;width:100%;padding:12px;border-radius:12px;border:2px solid #ffffff33;background:#0006;color:var(--ink)}
.fb{margin-top:14px;padding:14px;border-radius:12px;display:none}
.fb.ok{display:block;background:#3ddc8422;border-left:5px solid var(--good)}
.fb.no{display:block;background:#ff6b6b22;border-left:5px solid var(--bad)}
.fb strong{font-size:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.row>button{flex:1}
.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:34px;font-weight:800;color:var(--gold);text-shadow:0 2px 12px #000;pointer-events:none;z-index:5;animation:pop 1s forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}
.timer i{background:linear-gradient(90deg,var(--bad),var(--gold));transition:width .25s linear}
.boss{border:2px solid var(--bad)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
ul.rev{padding-left:20px} ul.rev li{margin:6px 0}
.scene{font-style:italic;background:#0005;border-left:4px solid var(--accent);border-radius:8px;padding:8px 12px;margin:8px 0}
.small{font-size:14px;color:var(--dim)}
.hero{display:flex;gap:12px;align-items:center;background:#ffffff0d;border-radius:12px;padding:10px;margin-top:10px}.hero .big{font-size:40px}
button.struck{opacity:.35;text-decoration:line-through}
a{color:var(--accent)}
@media (max-width:520px){html,body{font-size:16px}h2{font-size:20px}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="app"></div>

const DECK = {"id": "texas-filibusters", "title": "Texas Test Prep", "subject": "Texas History", "accent": "#ff9f43", "realm": "history", "intro": "Spanish Texas, 1754 to 1821: the Seven Years War, the Louisiana Purchase, Father Hidalgo, and the filibusters the Spanish were watching for.", "questions": [{"topic": "Seven Years War", "q": "The Seven Years War lasted from...", "choices": ["1754 to 1763", "1776 to 1783", "1803 to 1811", "1810 to 1821"], "answer": 0, "explain": "It ran 1754 to 1763."}, {"topic": "Seven Years War", "type": "type", "q": "In America the Seven Years War was known as the French and ______ War. (one word)", "accept": ["Indian", "Indians"], "explain": "Americans called it the French and Indian War."}, {"topic": "Seven Years War", "q": "After the war, Great Britain gained...", "choices": ["Canada and all land east of the Mississippi", "New Orleans and land west of the Mississippi", "Mexico", "Texas"], "answer": 0, "explain": "Britain took Canada plus everything east of the Mississippi River.", "review": "Britain = Canada + east"}, {"topic": "Seven Years War", "q": "After the war, Spain got...", "choices": ["New Orleans and French land west of the Mississippi", "Canada and land east of the Mississippi", "Florida and Canada", "nothing"], "answer": 0, "explain": "Spain got New Orleans and the French land west of the Mississippi (Louisiana).", "review": "Spain = New Orleans + west"}, {"topic": "Seven Years War", "q": "After the war, France was...", "choices": ["no longer a colonial power in the Americas", "the strongest power in the Americas", "in charge of Texas", "in charge of Canada"], "answer": 0, "explain": "France lost its land in North America, so it was no longer a colonial power there."}, {"topic": "Seven Years War", "q": "Why did losing France as a neighbor change things for Spanish Texas?", "choices": ["Louisiana was now Spain's, so Texas no longer bordered France", "France attacked Texas", "Texas became British", "The missions doubled"], "answer": 0, "explain": "With Louisiana in Spanish hands, Texas was no longer a border against France, so Spain rethought how to defend it."}, {"topic": "Rubí and Texas", "q": "Marqués de Rubí said Spain did not have the ______ or ______ to defend all its claims in Texas.", "choices": ["wealth, power", "priests, horses", "maps, roads", "ships, ports"], "answer": 0, "explain": "Rubí inspected the frontier and decided Spain lacked the wealth or power to hold it all.", "review": "Rubí: no wealth or power"}, {"topic": "Rubí and Texas", "q": "Rubí suggested closing all missions EXCEPT those in...", "choices": ["San Antonio and La Bahía (Goliad)", "Nacogdoches and Galveston", "New Orleans and Mexico City", "El Paso and Austin"], "answer": 0, "explain": "Keep San Antonio and La Bahía, close the rest (the East Texas missions were abandoned and settlers moved to San Antonio).", "review": "Rubí kept San Antonio + La Bahía"}, {"topic": "Rubí and Texas", "type": "type", "q": "Rubí kept the missions in La Bahía and in ______. (two words)", "accept": ["San Antonio"], "explain": "San Antonio, which became the capital of Spanish Texas."}, {"topic": "In America", "q": "In what year did the 13 colonies declare independence from Great Britain?", "choices": ["1776", "1763", "1803", "1821"], "answer": 0, "explain": "1776: the Declaration of Independence.", "review": "1776 = 13 colonies vs Great Britain"}, {"topic": "In America", "q": "In 1776 the 13 colonies fought for independence from...", "choices": ["Great Britain", "Spain", "France", "Mexico"], "answer": 0, "explain": "They fought Great Britain in the American Revolution."}, {"topic": "In America", "type": "type", "q": "In what year was the Louisiana Purchase? (number)", "accept": ["1803"], "explain": "1803: the United States bought Louisiana from France (Spain had given it back to France in 1800)."}, {"topic": "In America", "q": "The Louisiana Purchase did what to the size of the United States?", "choices": ["Doubled it", "Cut it in half", "Made it ten times bigger", "Nothing"], "answer": 0, "explain": "It doubled the size of the U.S., for about $15 million.", "review": "Louisiana Purchase doubled the U.S."}, {"topic": "In America", "q": "About how much did the U.S. pay for Louisiana?", "choices": ["$15 million", "$15 thousand", "$1 billion", "$500"], "answer": 0, "explain": "About $15 million, roughly 3 cents an acre."}, {"topic": "In America", "q": "Why was New Orleans so important to the U.S.?", "choices": ["A free port for trade down the Mississippi", "It had gold mines", "It was the capital of Texas", "It had the most missions"], "answer": 0, "explain": "Farmers shipped goods down the Mississippi to the port of New Orleans; owning it kept trade free."}, {"topic": "In America", "q": "Which expedition explored the Louisiana Purchase?", "choices": ["Lewis and Clark", "Nolan and Bean", "Hidalgo and Allende", "Austin and Barr"], "answer": 0, "explain": "Lewis and Clark set out in 1804 to explore the new land."}, {"topic": "In America", "q": "Why did the Louisiana Purchase worry Spain about Texas?", "choices": ["The U.S. was now Texas's next-door neighbor", "France was coming back", "Texas was sold too", "Mexico attacked"], "answer": 0, "explain": "Now Americans bordered Texas, and some, like filibusters, wanted it."}, {"topic": "Father Hidalgo", "q": "Mexicans were becoming unhappy with...", "choices": ["Spanish rule", "American rule", "French rule", "the missions closing"], "answer": 0, "explain": "People in New Spain were tired of Spanish rule."}, {"topic": "Father Hidalgo", "q": "Father Miguel Hidalgo y Costilla was a...", "choices": ["Catholic priest", "Spanish general", "American trader", "pirate"], "answer": 0, "explain": "Hidalgo was a Catholic priest in the town of Dolores.", "review": "Hidalgo was a priest"}, {"topic": "Father Hidalgo", "q": "Hidalgo's 1810 call to fight for independence is called the...", "choices": ["Grito de Dolores (Cry of Dolores)", "Declaration of Independence", "Louisiana Purchase", "Treaty of Paris"], "answer": 0, "explain": "On September 16, 1810 he rang the church bell in Dolores and called people to rise up: the Grito de Dolores.", "review": "Grito de Dolores, 1810"}, {"topic": "Father Hidalgo", "type": "type", "q": "In what year did Hidalgo call for independence? (number)", "accept": ["1810"], "explain": "1810. Mexico celebrates it every September 16."}, {"topic": "Father Hidalgo", "q": "Which was NOT one of the problems Hidalgo's army had?", "choices": ["Too many cannons", "No military training", "No equipment", "Lack of discipline"], "answer": 0, "explain": "His army was mostly farmers and workers: no training, little equipment, little discipline."}, {"topic": "Father Hidalgo", "q": "Name a problem with Hidalgo's army.", "choices": ["No military training", "Too many soldiers in uniform", "Too much money", "Too many generals"], "answer": 0, "explain": "No training, no equipment and lack of discipline."}, {"topic": "Father Hidalgo", "q": "What happened to Father Hidalgo in 1811?", "choices": ["He was captured and executed", "He became king of Mexico", "He moved to Texas", "He won the war"], "answer": 0, "explain": "After defeats he fled north, was captured and executed in 1811.", "review": "Hidalgo captured + executed 1811"}, {"topic": "Father Hidalgo", "q": "In what year did Mexico finally win independence?", "choices": ["1821", "1811", "1810", "1803"], "answer": 0, "explain": "1821: ten years after Hidalgo died, and Texas became part of Mexico.", "review": "Mexican independence 1821"}, {"topic": "Father Hidalgo", "q": "Hidalgo is known as the...", "choices": ["Father of the Nation (Mexico)", "King of Texas", "First filibuster", "Founder of San Antonio"], "answer": 0, "explain": "Hidalgo's call inspired the whole movement, so he is called the Father of Mexican Independence."}, {"topic": "Put it in order", "q": "Which came FIRST?", "choices": ["Seven Years War ends (1763)", "13 colonies declare independence (1776)", "Louisiana Purchase (1803)", "Grito de Dolores (1810)"], "answer": 0, "explain": "1763, then 1776, 1803, 1810, 1811, 1821."}, {"topic": "Put it in order", "q": "Which came LAST?", "choices": ["Mexico wins independence (1821)", "Hidalgo executed (1811)", "Grito de Dolores (1810)", "Louisiana Purchase (1803)"], "answer": 0, "explain": "1821 is the end of Spanish Texas."}, {"topic": "What is a filibuster?", "q": "In Texas history, a filibuster was someone who...", "choices": ["came from another country and tried to take land and power from the government by force", "gave very long speeches to delay a vote", "was a Spanish soldier guarding the border", "was a priest who started missions"], "answer": 0, "explain": "In Spanish Texas a filibuster was a foreign adventurer who came to fight the government for land, power and personal gain. (The long-speech meaning in Congress came later.)", "review": "the four filibuster criteria"}, {"topic": "What is a filibuster?", "type": "type", "q": "Which government decided who counted as a filibuster in Texas? (one word)", "accept": ["Spanish", "Spain", "the Spanish"], "explain": "Texas belonged to Spain until 1821, so it was the Spanish government that called these intruders filibusters."}, {"topic": "The four criteria", "q": "Criterion 1: a filibuster was from a ______ country (not Spanish).", "choices": ["foreign", "neighboring Spanish", "native", "friendly"], "answer": 0, "explain": "A filibuster was a foreigner. Someone born in Spain or New Spain could rebel, but would not be called a filibuster."}, {"topic": "The four criteria", "type": "type", "q": "Criterion 2: a filibuster came to ______ the government. (one word)", "accept": ["fight", "attack", "overthrow"], "explain": "Filibusters came prepared to fight the Spanish government, usually with a small private army."}, {"topic": "The four criteria", "q": "Criterion 3: a filibuster wanted...", "choices": ["land and power", "religious freedom", "to learn Spanish", "to trade peacefully"], "answer": 0, "explain": "They wanted to grab land and power in Texas for themselves."}, {"topic": "The four criteria", "q": "Criterion 4: a filibuster wanted personal gain, meaning they wanted to...", "choices": ["get rich", "help the Spanish king", "spread their religion", "protect Native Americans"], "answer": 0, "explain": "Personal gain means wealth: filibusters hoped to get rich."}, {"topic": "The four criteria", "q": "How many of the four criteria must a person meet to be a filibuster?", "choices": ["All four", "Any one", "Any two", "Just 'foreigner'"], "answer": 0, "explain": "On the worksheet, only people with a check in every column are filibusters. Missing even one (like not fighting the government) makes it a NO."}, {"topic": "The people", "q": "Philip Nolan: filibuster or not?", "choices": ["Filibuster", "Not a filibuster"], "answer": 0, "explain": "Nolan was an American horse trader who led armed men into Texas without permission. He meets all four criteria. Spanish troops killed him in 1801."}, {"topic": "The people", "q": "Moses Austin: filibuster or not?", "choices": ["Filibuster", "Not a filibuster"], "answer": 1, "explain": "Austin was a foreigner who wanted land and wealth, but he asked Spain for permission to bring settlers (1821). He was not prepared to fight the government, so he is a NO.", "review": "Moses Austin asked permission, did not fight"}, {"topic": "The people", "q": "Peter Ellis Bean: filibuster or not?", "choices": ["Filibuster", "Not a filibuster"], "answer": 0, "explain": "Bean was an American who rode with Philip Nolan. He was captured by the Spanish when Nolan was killed. Foreigner, fought, wanted land and gain: all four checks."}, {"topic": "The people", "q": "Barr: filibuster or not?", "choices": ["Filibuster", "Not a filibuster"], "answer": 1, "explain": "Barr was a foreigner (an Irish-born trader in Nacogdoches) who wanted land and money, but he traded with Spain's permission instead of fighting it. No fighting, so NO.", "review": "Barr helped, did not fight"}, {"topic": "The people", "q": "Father Miguel Hidalgo: filibuster or not?", "choices": ["Filibuster", "Not a filibuster"], "answer": 1, "explain": "Hidalgo did fight the government (he started Mexico's war for independence in 1810), but he was born in New Spain, not a foreigner. So he is a NO.", "review": "Father Hidalgo was not a foreigner"}, {"topic": "The people", "q": "James Long: filibuster or not?", "choices": ["Filibuster", "Not a filibuster"], "answer": 0, "explain": "Long was an American who led armed expeditions into Texas (starting 1819) and declared Texas independent. All four checks."}, {"topic": "The people", "q": "Jean Lafitte: filibuster or not?", "choices": ["Filibuster", "Not a filibuster"], "answer": 0, "explain": "Lafitte was a French-born pirate based on Galveston Island who wanted riches and helped filibusters like James Long. Your worksheet counts him as a filibuster."}, {"topic": "Why the answer", "q": "Father Hidalgo fought the Spanish government. What criterion is he MISSING?", "choices": ["He was not a foreigner", "He did not fight", "He did not want power", "He was too old"], "answer": 0, "explain": "Fighting is not enough. Hidalgo was from New Spain (Mexico), so he fails the 'foreigner' test."}, {"topic": "Why the answer", "q": "Moses Austin and Barr are both NO for the same reason. What is it?", "choices": ["They were not prepared to fight the government", "They were Spanish", "They did not want land", "They never came to Texas"], "answer": 0, "explain": "Both were foreigners who wanted land and gain, but they worked with Spain instead of fighting it."}, {"topic": "Why the answer", "q": "Who was Philip Nolan's companion that was captured by the Spanish?", "choices": ["Peter Ellis Bean", "James Long", "Moses Austin", "Jean Lafitte"], "answer": 0, "explain": "Peter Ellis Bean rode with Nolan in 1801 and spent years as a Spanish prisoner."}, {"topic": "Why the answer", "q": "Which filibuster was a pirate on Galveston Island?", "choices": ["Jean Lafitte", "Philip Nolan", "Peter Ellis Bean", "Father Hidalgo"], "answer": 0, "explain": "Jean Lafitte ran a pirate base at Galveston."}, {"topic": "Why the answer", "type": "type", "q": "Name one person on the worksheet who is a filibuster.", "accept": ["Philip Nolan", "Nolan", "Peter Ellis Bean", "Peter Bean", "Bean", "James Long", "Long", "Jean Lafitte", "Lafitte"], "explain": "The four filibusters on the sheet: Philip Nolan, Peter Ellis Bean, James Long and Jean Lafitte."}]};
// ---------- storage ----------
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const KEY='studywright:'+DECK.id, HKEY='studywright:heroes', RKEY='studywright:records';
const STAT=DECK.stat||String(DECK.subject).split(':')[0].trim()||'Study';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return String(s).toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function lev(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]}
function typedOk(q,v){const n=norm(v);if(!n)return false;return q.accept.some(a=>{const t=norm(a);return n===t||(t.length>4&&lev(n,t)<=Math.floor(t.length/5))})}

const H={all(){return store.get(HKEY)||{active:null,list:[]}},save(d){store.set(HKEY,d)},
 cur(){const d=H.all();return d.list.find(h=>h.id===d.active)||null},

const need=L=>50*L*(L+1); // total XP needed to reach level L+1
function heroLvl(h){let L=1;while(h.xp>=need(L))L++;return L}
function area(h,s){const a=h.areas[s]||{use:0,train:0};return{...a,lvl:Math.floor(a.use/15)+a.train}}

function featName(f){const[b,ar]=f.split(':');return FEATS[b].name+(ar?' ('+esc(ar)+')':'')}

  if(k==='mission'){const w=M(0xd9b382);const b=new THREE.Mesh(new THREE.BoxGeometry(2,1.6,1.2),w);b.position.y=.8;g.add(b);const t=new THREE.Mesh(new THREE.BoxGeometry(.7,1.2,.7),w);t.position.set(.6,2.2,0);g.add(t);const bell=new THREE.Mesh(new THREE.SphereGeometry(.18,8,8),M(0xb08d3a,{metalness:.6}));bell.position.set(.6,2.3,.36);g.add(bell);const d=new THREE.Mesh(new THREE.BoxGeometry(.5,.8,.05),M(0x4a2a14));d.position.set(-.3,.4,.61);g.add(d);
   const c=new THREE.Mesh(new THREE.CylinderGeometry(.15,.18,1.4,8),M(0x3f7a3a));c.position.set(-1.8,.7,.6);g.add(c);const a=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,.6,8),M(0x3f7a3a));a.position.set(-1.55,.9,.6);a.rotation.z=-1;g.add(a)}
  else if(k==='tree'){const tr=new THREE.Mesh(new THREE.CylinderGeometry(.2,.35,2.4,8),M(0x5a3a1e));tr.position.y=1.2;g.add(tr);for(let i=0;i<3;i++){const f=new THREE.Mesh(new THREE.ConeGeometry(1.3-i*.3,1.4,8),M(new THREE.Color().setHSL(.3+Math.random()*.08,.6,.28+i*.05)));f.position.y=2.2+i*.8;g.add(f)}
   const mu=new THREE.Mesh(new THREE.SphereGeometry(.35,10,6,0,Math.PI*2,0,Math.PI/2),M(0xd94a3a));mu.position.set(1,.35,.5);g.add(mu);const st=new THREE.Mesh(new THREE.CylinderGeometry(.08,.1,.35,6),M(0xf0e6d0));st.position.set(1,.17,.5);g.add(st)}
  else if(k==='gear'){const gr=new THREE.Mesh(new THREE.TorusGeometry(.8,.25,6,12),M(0xc0a060,{metalness:.7}));gr.position.y=1.2;g.add(gr);g.userData.spin=gr}
  else if(k==='book'){for(let i=0;i<4;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(1.2,.3,.9),M(new THREE.Color().setHSL(Math.random(),.5,.4)));b.position.y=.15+i*.3;b.rotation.y=Math.random();g.add(b)}}
  else{const c=new THREE.Mesh(new THREE.OctahedronGeometry(.6),M(new THREE.Color().setHSL(Math.random(),.7,.6),{emissive:0x221144}));c.position.y=1;c.scale.y=1.8;g.add(c)}
  return g}
 const props=new THREE.Group();sc.add(props);for(let i=0;i<14;i++){const p=prop(REALM.prop);const a=i/14*Math.PI*2+Math.random()*.3,rr=8+Math.random()*10;p.position.set(Math.cos(a)*rr,-.4,Math.sin(a)*rr);p.rotation.y=Math.random()*6;p.scale.setScalar(.8+Math.random()*.6);props.add(p)}
 const heroCol={Scholar:0x4cc9f0,Ranger:0x3ddc84,Knight:0xc0c8d8,Mage:0xb388ff};const hc=(H.cur()&&heroCol[H.cur().cls])||0xffd166;
 const hero=new THREE.Group();const hb=new THREE.Mesh(new THREE.CylinderGeometry(.22,.32,.7,10),M(hc,{metalness:.3}));hb.position.y=.35;hero.add(hb);const hh=new THREE.Mesh(new THREE.SphereGeometry(.2,12,10),M(0xf2c9a0));hh.position.y=.9;hero.add(hh);
 const cape=new THREE.Mesh(new THREE.ConeGeometry(.35,.75,10,1,true),M(0xaa2233,{side:THREE.DoubleSide}));cape.position.set(0,.4,-.08);hero.add(cape);sc.add(hero);let heroY=0,jump=0;
 function obstacle(){const g=new THREE.Group();const k=REALM.obstacle;
  if(k==='gate'){const w=M(0x6a4422);[-.55,.55].forEach(x=>{const p=new THREE.Mesh(new THREE.BoxGeometry(.18,1.3,.18),w);p.position.set(x,.65,0);g.add(p)});const bar=new THREE.Mesh(new THREE.BoxGeometry(1.3,.14,.14),M(0x3a2410));bar.position.y=.9;g.add(bar);const bar2=bar.clone();bar2.position.y=.45;g.add(bar2)}
  else if(k==='vine'){for(let i=0;i<5;i++){const v=new THREE.Mesh(new THREE.TorusGeometry(.4+i*.05,.06,5,12,Math.PI*1.5),M(0x2f6a1f));v.position.y=.6;v.rotation.set(Math.random()*3,Math.random()*3,0);g.add(v)}const th=new THREE.Mesh(new THREE.SphereGeometry(.15,8,6),M(0xcc3355));th.position.y=1.1;g.add(th)}
  else if(k==='lock'){const b=new THREE.Mesh(new THREE.BoxGeometry(.8,.7,.3),M(0xc0a060,{metalness:.8}));b.position.y=.4;g.add(b);const sh=new THREE.Mesh(new THREE.TorusGeometry(.28,.07,6,12,Math.PI),M(0x999999,{metalness:.8}));sh.position.y=.75;g.add(sh)}
  else{const o=new THREE.Mesh(new THREE.IcosahedronGeometry(.45),M(0x8866ff,{emissive:0x331166}));o.position.y=.7;g.add(o)}
  return g}
 let obs=null;function newObs(){if(obs)sc.remove(obs);obs=obstacle();sc.add(obs)}
 function shatter(at,col){for(let i=0;i<30;i++){const p=new THREE.Mesh(new THREE.BoxGeometry(.1,.1,.1),new THREE.MeshBasicMaterial({color:col}));p.position.copy(at);p.position.y+=.6;p.userData.v=new THREE.Vector3((Math.random()-.5)*.25,Math.random()*.25,(Math.random()-.5)*.25);p.userData.life=50;parts.add(p)}}
 
 const stars=(REALM.prop==='mission'||REALM.prop==='tree')?new THREE.Group():new THREE.Points(new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute(Array.from({length:900},()=>(Math.random()-.5)*80),3)),new THREE.PointsMaterial({color:0xffffff,size:.08}));sc.add(stars);
 const accent=new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#7aa2ff');
 let wob=0,camY=3;
 function size(){const w=innerWidth,h=innerHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',size);size();
 function add(gold){const n=tower.children.length;const m=new THREE.Mesh(new THREE.BoxGeometry(1.6,.5,1.6),new THREE.MeshStandardMaterial({color:gold?0xffd166:accent.clone().offsetHSL((n*.03)%1,0,0),emissive:gold?0x664400:0x000000,metalness:.3,roughness:.4}));
  m.position.set((Math.random()-.5)*.25,n*.52+6,(Math.random()-.5)*.25);m.rotation.y=n*.35;m.userData.ty=n*.52+.25;tower.add(m);if(obs)shatter(obs.position,REALM.obstacle==='vine'?0x2f6a1f:0x8a6a3a);heroY=(n+1)*.52;jump=1;setTimeout(newObs,350)}
 function burst(){const top=tower.children.length*.52;for(let i=0;i<60;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.07,6,6),new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(Math.random(),1,.6)}));p.position.set(0,top,0);p.userData.v=new THREE.Vector3((Math.random()-.5)*.3,Math.random()*.3,(Math.random()-.5)*.3);p.userData.life=80;parts.add(p)}}
 function reset(){tower.clear();parts.clear();heroY=0;newObs();const c=H.cur();if(c&&heroCol[c.cls])hb.material.color.setHex(heroCol[c.cls])}newObs();
 let t=0;(function loop(){requestAnimationFrame(loop);t+=.005;
  tower.children.forEach(m=>{m.position.y+=(m.userData.ty-m.position.y)*.15});
  tower.rotation.z=Math.sin(wob*20)*wob*.15;
  const top=tower.children.length*.52;const hy=hero.position.y+(heroY-hero.position.y)*.12;jump*=.9;hero.position.set(Math.sin(wob*30)*wob*.3,hy+Math.sin(jump*Math.PI)*.8,0);hero.rotation.y=t*2;
  if(obs){obs.position.set(.95,top,0);obs.rotation.y=-t;obs.scale.setScalar(1+Math.sin(t*12)*.03+wob*.3)}
  props.children.forEach(p=>{if(p.userData.spin)p.userData.spin.rotation.z+=.01});wob*=.92;
  parts.children.slice().forEach(p=>{p.position.add(p.userData.v);p.userData.v.y-=.006;if(--p.userData.life<=0)parts.remove(p)});
  const h=tower.children.length*.52;camY+=((h+3)-camY)*.05;cam.position.set(Math.sin(t)*10,camY+2,Math.cos(t)*10);cam.lookAt(0,Math.max(1,h-1),0);stars.rotation.y=t*.2;r.render(sc,cam)})();
 return{add,wobble(){wob=1},burst,reset}}catch(e){return none}})();
