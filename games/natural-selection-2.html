<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survival Tower II: Proving Ground</title>
<style>
:root{--bg:#0d1020;--panel:#171b33ee;--ink:#eef1ff;--dim:#a8b0d8;--accent:#8be37a;--good:#3ddc84;--bad:#ff6b6b;--gold:#ffd166}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:18px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
#scene{position:fixed;inset:0;z-index:0}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:16px;min-height:100%;display:flex;flex-direction:column;gap:12px}
.hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel);border-radius:14px;padding:10px 14px}
.hud b{color:var(--gold)}
.bar{flex:1 1 160px;height:12px;background:#ffffff22;border-radius:8px;overflow:hidden;min-width:120px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .4s}
.card{background:var(--panel);border-radius:18px;padding:20px;box-shadow:0 10px 40px #0008}
.topic{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
h1{margin:.2em 0;font-size:30px} h2{margin:.3em 0 .6em;font-size:23px}
.choices{display:grid;gap:10px}
button{font:inherit;color:var(--ink);background:#ffffff14;border:2px solid #ffffff22;border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;transition:transform .08s,background .2s}
button:hover:not(:disabled){background:#ffffff26;transform:translateY(-1px)}
button:disabled{cursor:default}
button.right{border-color:var(--good);background:#3ddc8433}
button.wrong{border-color:var(--bad);background:#ff6b6b33}
.go{background:var(--accent);border-color:transparent;font-weight:700;text-align:center;color:#0d1020}
input[type=text]{font:inherit;width:100%;padding:12px;border-radius:12px;border:2px solid #ffffff33;background:#0006;color:var(--ink)}
.fb{margin-top:14px;padding:14px;border-radius:12px;display:none}
.fb.ok{display:block;background:#3ddc8422;border-left:5px solid var(--good)}
.fb.no{display:block;background:#ff6b6b22;border-left:5px solid var(--bad)}
.fb strong{font-size:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.row>button{flex:1}
.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:34px;font-weight:800;color:var(--gold);text-shadow:0 2px 12px #000;pointer-events:none;z-index:5;animation:pop 1s forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
ul.rev{padding-left:20px} ul.rev li{margin:6px 0}
.small{font-size:14px;color:var(--dim)}
.hero{display:flex;gap:12px;align-items:center;background:#ffffff0d;border-radius:12px;padding:10px;margin-top:10px}.hero .big{font-size:40px}
button.struck{opacity:.35;text-decoration:line-through}
a{color:var(--accent)}
@media (max-width:520px){html,body{font-size:16px}h2{font-size:20px}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DECK = {"id": "natural-selection-2", "follows": "natural-selection", "title": "Survival Tower II: Proving Ground", "subject": "Science: Natural Selection (follow-up check)", "accent": "#8be37a", "intro": "New animals, same rules. Moths, rabbits, bacteria and finches: prove you can use natural selection, not just remember the sheet.", "questions": [{"topic": "Fitness", "type": "type", "q": "In biology, 'fitness' means surviving AND being able to ______.", "accept": ["reproduce", "reproduction", "have offspring", "have babies"], "explain": "Fitness is about passing on genes: an animal that lives a long time but never has offspring has low fitness."}, {"topic": "Fitness", "q": "Which deer has the HIGHEST fitness?", "choices": ["A small deer that lives 6 years and has 8 fawns", "A huge, strong deer that lives 12 years and has no fawns", "The fastest deer, which has 1 fawn", "A deer that wins every fight but has 2 fawns"], "answer": 0, "explain": "Fitness counts offspring, not size or strength. The deer with 8 fawns passes on the most genes.", "review": "Fitness = survive AND reproduce (count the babies)"}, {"topic": "Variation", "q": "A population of plants are all exact clones. A new disease arrives. Why is this dangerous for them?", "choices": ["With no genetic variation, none may have a trait that resists the disease", "Clones always grow slower", "Diseases only attack clones", "Clones cannot make seeds"], "answer": 0, "explain": "Natural selection needs genetic variation. If every plant is identical, they all share the same weakness."}, {"topic": "Variation", "type": "type", "q": "Natural selection can only work if there is ______ variation (differences in the DNA) in the population.", "accept": ["genetic", "genetics"], "explain": "Only genetic differences are inherited, so only genetic variation lets a population change over generations.", "review": "Natural selection needs GENETIC variation"}, {"topic": "Variation", "q": "A dog learns to open doors. Will her puppies be born knowing how?", "choices": ["No, learned skills are not in the DNA", "Yes, all skills are passed on", "Only if she practices a lot", "Only the boy puppies"], "answer": 0, "explain": "Learned behaviors and injuries are not genetic, so they are not inherited."}, {"topic": "Mutation", "type": "type", "q": "A bacterium's DNA changes by accident when it copies itself, giving it a brand new trait. This change is called a ______.", "accept": ["mutation", "mutations"], "explain": "A mutation is a change in DNA during copying. It is how brand-new traits appear.", "review": "Copying change in DNA = mutation"}, {"topic": "Mutation", "q": "Where do brand-new traits, not found in either parent, come from?", "choices": ["Mutations in DNA", "The animal wishing for them", "Eating different food", "Exercise"], "answer": 0, "explain": "Mixing parents' genes only reshuffles traits that already exist. Totally new traits come from mutations."}, {"topic": "Reproduction", "q": "Fish A reproduces sexually. Fish B reproduces asexually. Which species can adapt faster to a warming lake?", "choices": ["Fish A, because sexual reproduction creates more variation", "Fish B, because it makes copies faster", "Both the same", "Neither can ever adapt"], "answer": 0, "explain": "Sexual reproduction mixes two parents' genes, so the offspring vary more. More variation gives natural selection more to choose from, so evolution is faster.", "review": "Sexual reproduction = more variation = FASTER evolution"}, {"topic": "Reproduction", "type": "type", "q": "Because it makes more variation, evolution happens ______ in organisms that reproduce sexually. (faster or slower?)", "accept": ["faster", "quicker", "more quickly", "quickly"], "explain": "More variation means more chances that some offspring have a helpful trait, so the population changes faster."}, {"topic": "Reproduction", "q": "Why do brothers and sisters look different from each other?", "choices": ["Each gets a different mix of genes from the two parents", "They are mutations", "They chose different looks", "Asexual reproduction"], "answer": 0, "explain": "Sexual reproduction gives each child its own mix of the parents' genes."}, {"topic": "Steps", "q": "What is the FIRST step of natural selection?", "choices": ["Variation exists in the population", "The fittest survive", "The trait becomes common", "The environment changes the animal"], "answer": 0, "explain": "Step 1 variation, step 2 the better-suited survive and reproduce more, step 3 their trait becomes common over generations.", "review": "Step 1 = VARIATION exists"}, {"topic": "Steps", "q": "Put these in order: (1) more brown rabbits survive winter, (2) some rabbits are brown and some white, (3) most rabbits are now brown.", "choices": ["2 → 1 → 3", "1 → 2 → 3", "3 → 2 → 1", "1 → 3 → 2"], "answer": 0, "explain": "First variation exists (2), then the better-suited survive and reproduce (1), then the trait becomes common (3)."}, {"topic": "Populations", "q": "Over 100 years a moth population changes from mostly light to mostly dark. What changed?", "choices": ["The population: more dark moths survived and reproduced", "Each light moth turned dark", "The moths decided to be dark", "One moth changed and the rest copied"], "answer": 0, "explain": "Individuals cannot change their genes. The POPULATION changes because the better-suited ones leave more offspring.", "review": "Natural selection changes POPULATIONS, not individuals"}, {"topic": "Populations", "type": "type", "q": "Natural selection changes ______, not individuals.", "accept": ["populations", "population", "the population"], "explain": "A single animal keeps the genes it was born with; the mix of genes in the population is what shifts."}, {"topic": "Populations", "q": "Giraffes have long necks. Which explanation is correct?", "choices": ["Giraffes born with longer necks reached more food, survived and had more babies", "Giraffes stretched their necks and passed on the stretch", "Giraffes wanted long necks", "Short-necked giraffes grew taller each year"], "answer": 0, "explain": "Stretching is not inherited. Giraffes BORN with longer necks did better and passed on long-neck genes over many generations."}, {"topic": "Time", "type": "type", "q": "Natural selection is slow. It happens over many ______.", "accept": ["generations", "generation"], "explain": "Each generation shifts the population a little, so big changes take many generations.", "review": "Natural selection takes many GENERATIONS"}, {"topic": "Time", "q": "Why do bacteria evolve antibiotic resistance in months, but elephants take thousands of years to change?", "choices": ["Bacteria have a new generation every hour or so", "Bacteria are smarter", "Elephants have no genes", "Antibiotics are magic"], "answer": 0, "explain": "Change happens per generation. Bacteria pack thousands of generations into a year."}, {"topic": "Camouflage", "q": "White and brown rabbits live in a snowy forest. Which ones will owls most likely see?", "choices": ["Brown rabbits", "White rabbits", "Both the same", "Neither"], "answer": 0, "explain": "Brown stands out against white snow; white rabbits are camouflaged.", "review": "The color that does NOT match the background gets seen and eaten"}, {"topic": "Camouflage", "q": "On a beach of mostly dark gray rocks, which crabs survive best?", "choices": ["Dark gray crabs", "Bright orange crabs", "Yellow crabs", "White crabs"], "answer": 0, "explain": "Crabs that match the background are hidden from birds, so they survive and reproduce more."}, {"topic": "Camouflage", "q": "Bright red, blue and brown beetles live on brown tree bark. After many generations, most beetles will probably be...", "choices": ["Brown", "Red", "Blue", "Evenly mixed"], "answer": 0, "explain": "Red and blue beetles are spotted and eaten; brown beetles survive and pass on brown genes."}, {"topic": "Apply it", "q": "A drought means only hard seeds are left on an island. Finches with thick beaks can crack them. What happens to the next generations?", "choices": ["More finches have thick beaks", "Thin-beaked finches grow thick beaks", "Finches stop eating", "Beaks get thinner"], "answer": 0, "explain": "Thick-beaked finches eat, survive and reproduce more, so thick beaks become more common."}, {"topic": "Apply it", "q": "A farmer sprays insect poison. A few bugs survive because of a mutation. Years later, the poison barely works. Why?", "choices": ["The survivors passed on the resistance gene, so the population became resistant", "The bugs got used to it during their lives", "The poison went bad", "The bugs learned to hold their breath"], "answer": 0, "explain": "Variation (the mutation) + selection (the poison kills the others) + inheritance over generations = a resistant population."}]};
// ---------- storage ----------
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const KEY='studywright:'+DECK.id, HKEY='studywright:heroes', RKEY='studywright:records';
const STAT=DECK.stat||String(DECK.subject).split(':')[0].trim()||'Study';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return String(s).toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function lev(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]}
function typedOk(q,v){const n=norm(v);if(!n)return false;return q.accept.some(a=>{const t=norm(a);return n===t||(t.length>4&&lev(n,t)<=Math.floor(t.length/5))})}
// ---------- hero (persists across every studywright game in this browser) ----------
const CLASSES={Scholar:{icon:'📜',feat:'scribe'},Ranger:{icon:'🏹',feat:'keen'},Knight:{icon:'🛡️',feat:'wind'},Mage:{icon:'🔮',feat:'focus'}};
const FEATS={keen:{name:'Keen Eye',desc:'Once per quest, strike out one wrong choice.'},
 wind:{name:'Second Wind',desc:'Your first miss each quest does not break your streak.'},
 scribe:{name:'Scribe',desc:'+5 XP for every typed answer you get right.'},
 grit:{name:'Grit',desc:'+10 XP when you finally get a question you missed. Mistakes make you stronger.'},
 focus:{name:'Battle Focus',desc:'Gold streaks start at 2 in a row instead of 3.'},
 sage:{name:'Sage',desc:'+3 XP per right answer in one study area (needs that area at level 3).',area:true}};
const H={all(){return store.get(HKEY)||{active:null,list:[]}},save(d){store.set(HKEY,d)},
 cur(){const d=H.all();return d.list.find(h=>h.id===d.active)||null},
 put(h){const d=H.all();const i=d.list.findIndex(x=>x.id===h.id);if(i<0)d.list.push(h);else d.list[i]=h;d.active=h.id;H.save(d)}};
const need=L=>50*L*(L+1); // total XP needed to reach level L+1
function heroLvl(h){let L=1;while(h.xp>=need(L))L++;return L}
function area(h,s){const a=h.areas[s]||{use:0,train:0};return{...a,lvl:Math.floor(a.use/15)+a.train}}
function hasFeat(h,f){return !!h&&h.feats.includes(f)}
function featName(f){const[b,ar]=f.split(':');return FEATS[b].name+(ar?' ('+esc(ar)+')':'')}
function newHero(name,cls){return{id:'h'+Date.now().toString(36),name,cls,xp:0,areas:{},feats:[CLASSES[cls].feat],picks:0,created:new Date().toISOString(),quests:0}}
const goldAt=()=>hasFeat(H.cur(),'focus')?2:3;
// ---------- run ----------
function newRun(){S={queue:shuffle(DECK.questions.map((_,i)=>i)),mastered:new Set(),firstMiss:new Set(),seen:new Set(),xp:0,streak:0,best:0,answered:0,correct:0,log:{},keen:false,wind:false,started:new Date().toISOString()}}
const app=document.getElementById('app');
function hud(){const h=H.cur();const pct=100*S.mastered.size/DECK.questions.length;const L=heroLvl(h);const lo=L>1?need(L-1):0;
 return `<div class="hud"><span>${CLASSES[h.cls].icon} <b>${esc(h.name)}</b></span><span>Lv <b>${L}</b> <span class="small">(${h.xp-lo}/${need(L)-lo})</span></span><span>${esc(STAT)} <b>${area(h,STAT).lvl}</b></span><span>Streak <b>${S.streak}</b>${S.streak>=goldAt()?' 🔥':''}</span><div class="bar" title="mastered"><i style="width:${pct}%"></i></div><span class="small">${S.mastered.size}/${DECK.questions.length} mastered</span></div>`}
// ---------- screens ----------
function title(){const h=H.cur();if(!h)return heroCreate(false);const rec=store.get(KEY);const a=area(h,STAT);
 app.innerHTML=`<div class="card"><div class="topic">${esc(DECK.subject)}</div><h1>${esc(DECK.title)}</h1><p>${DECK.intro}</p>
 <p class="small">Every right answer stacks a block on your tower and trains your hero. Streaks make gold blocks and double XP. Miss one and it comes back later until you get it.</p>
 ${rec?`<p class="small">Best so far: ${rec.score}% right on first try, top streak ${rec.best}.</p>`:''}
 <div class="hero"><div class="big">${CLASSES[h.cls].icon}</div><div><b>${esc(h.name)}</b> the ${h.cls} · Level ${heroLvl(h)} · ${h.quests} quests<br><span class="small">${esc(STAT)} level ${a.lvl} · Feats: ${h.feats.map(featName).join(', ')}</span></div></div>
 <div class="row"><button class="go" id="start">Start quest ▶</button><button id="sheet">Character sheet</button><button id="switch">Switch hero</button></div></div>`;
 document.getElementById('start').onclick=()=>{newRun();World.reset();next()};
 document.getElementById('sheet').onclick=sheet;document.getElementById('switch').onclick=switcher}
function heroCreate(back){app.innerHTML=`<div class="card"><h1>Create your hero</h1><p>Your hero levels up in every studywright game you play. You can make more heroes later and switch between them.</p>
 <input type="text" id="hn" maxlength="24" placeholder="Hero name" autocomplete="off"><h2>Pick a class</h2><div class="choices">${Object.entries(CLASSES).map(([c,v])=>`<button data-c="${c}">${v.icon} <b>${c}</b>: starts with ${FEATS[v.feat].name}. <span class="small">${FEATS[v.feat].desc}</span></button>`).join('')}</div>
 <div class="row">${back?'<button id="bk">Back</button>':''}<button id="imp">Load hero from a saved record</button></div></div>`;
 app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const n=document.getElementById('hn').value.trim();if(!n){document.getElementById('hn').focus();popup('Name your hero first');return}H.put(newHero(n,b.dataset.c));title()});
 if(back)document.getElementById('bk').onclick=title;document.getElementById('imp').onclick=importHero}
function switcher(){const d=H.all();app.innerHTML=`<div class="card"><h1>Heroes</h1><div class="choices">${d.list.map(h=>`<button data-h="${h.id}">${CLASSES[h.cls].icon} <b>${esc(h.name)}</b> the ${h.cls} · Level ${heroLvl(h)}${h.id===d.active?' · <i>playing</i>':''}</button>`).join('')}</div>
 <div class="row"><button class="go" id="nh">New hero +</button><button id="bk">Back</button></div></div>`;
 app.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{d.active=b.dataset.h;H.save(d);title()});
 document.getElementById('nh').onclick=()=>heroCreate(true);document.getElementById('bk').onclick=title}
function sheet(){const h=H.cur();const recs=(store.get(RKEY)||[]).filter(r=>r.hero&&r.hero.id===h.id);
 const games={};recs.forEach(r=>{const g=games[r.deck]=games[r.deck]||{title:r.title,runs:[]};g.runs.push(r)});
 app.innerHTML=`<div class="card"><h1>${CLASSES[h.cls].icon} ${esc(h.name)}</h1><p>${h.cls} · Level ${heroLvl(h)} · ${h.xp} XP · ${h.quests} quests finished</p>
 <h2>Study areas</h2><p class="small">Areas rise by use (every 15 right answers) and by training from level-ups. Each level adds +1 XP per right answer in that area.</p>
 <ul class="rev">${Object.keys(h.areas).length?Object.keys(h.areas).map(s=>{const a=area(h,s);return`<li><b>${esc(s)}</b> level ${a.lvl} <span class="small">(${a.use} right answers, ${a.train} trained)</span></li>`}).join(''):'<li>None yet. Finish a quest!</li>'}</ul>
 <h2>Feats</h2><ul class="rev">${h.feats.map(f=>`<li><b>${featName(f)}</b>: ${FEATS[f.split(':')[0]].desc}</li>`).join('')}</ul>
 <h2>Games and quizzes</h2><ul class="rev">${Object.keys(games).length?Object.entries(games).map(([id,g])=>`<li><a href="${esc(id)}.html">${esc(g.title)}</a> · played ${g.runs.length}× · best ${Math.max(...g.runs.map(r=>r.score_first_try))}% · last ${g.runs[g.runs.length-1].finished.slice(0,10)}<br><span class="small">${g.runs.slice(-5).map(r=>r.finished.slice(0,10)+': '+r.score_first_try+'%'+(r.first_try_misses.length?' (missed: '+r.first_try_misses.map(m=>esc(m.topic)).join(', ')+')':'')).join('<br>')}</span></li>`).join(''):'<li>No quests yet.</li>'}</ul>
 <div class="row"><button id="dl">Download all records</button><button class="go" id="bk">Back</button></div></div>`;
 document.getElementById('bk').onclick=title;document.getElementById('dl').onclick=()=>download('studywright-all-records-'+stamp()+'.json',{studywright_records:1,heroes:H.all(),records:store.get(RKEY)||[]})}
function importHero(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const f=i.files[0];if(!f)return;f.text().then(t=>{try{const j=JSON.parse(t);const hs=j.hero?[j.hero]:(j.heroes&&j.heroes.list)||[];if(!hs.length)throw 0;hs.forEach(h=>H.put(h));if(j.records){const all=store.get(RKEY)||[];j.records.forEach(r=>{if(!all.some(x=>x.finished===r.finished))all.push(r)});store.set(RKEY,all)}title()}catch(e){popup('No hero in that file')}})};i.click()}
function next(){const h=H.cur();if(h.picks>0)return levelUp();if(!S.queue.length)return finish();const qi=S.queue[0];const q=DECK.questions[qi];
 let body='';
 if(q.type==='type'){body=`<input type="text" id="ans" autocomplete="off" placeholder="Type your answer"><div class="row"><button class="go" id="check">Check</button></div>`}
 else{const order=shuffle(q.choices.map((c,i)=>i));body=`<div class="choices">${order.map((i,k)=>`<button data-i="${i}">${String.fromCharCode(65+k)}. ${q.choices[i]}</button>`).join('')}</div>${hasFeat(h,'keen')&&!S.keen&&q.choices.length>2?'<div class="row"><button id="keen">🔍 Keen Eye: strike a wrong choice (once per quest)</button></div>':''}`}
 app.innerHTML=hud()+`<div class="card" id="card"><div class="topic">${q.topic||''}</div><h2>${q.q}</h2>${body}<div class="fb" id="fb"></div></div>`;
 const kb=document.getElementById('keen');if(kb)kb.onclick=()=>{S.keen=true;const w=shuffle([...app.querySelectorAll('.choices button')].filter(b=>+b.dataset.i!==q.answer))[0];w.disabled=true;w.classList.add('struck');kb.remove()};
 if(q.type==='type'){const inp=document.getElementById('ans');inp.focus();const go=()=>answer(qi,typedOk(q,inp.value),inp.value);document.getElementById('check').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter'){e.stopPropagation();go()}}}
 else app.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>{const pick=+b.dataset.i;app.querySelectorAll('.choices button').forEach(x=>{x.disabled=true;if(+x.dataset.i===q.answer)x.classList.add('right')});if(pick!==q.answer)b.classList.add('wrong');answer(qi,pick===q.answer,q.choices[pick])})}
function answer(qi,ok,given){const q=DECK.questions[qi];const h=H.cur();S.queue.shift();S.answered++;
 const first=!S.seen.has(qi);S.seen.add(qi);(S.log[qi]=S.log[qi]||[]).push({given:String(given),ok});
 if(ok){S.correct++;S.streak++;S.best=Math.max(S.best,S.streak);S.mastered.add(qi);const gold=S.streak>=goldAt();
  const a=h.areas[STAT]=h.areas[STAT]||{use:0,train:0};const before=area(h,STAT).lvl;a.use++;
  let gain=(gold?20:10)+area(h,STAT).lvl;if(q.type==='type'&&hasFeat(h,'scribe'))gain+=5;if(!first&&hasFeat(h,'grit'))gain+=10;if(hasFeat(h,'sage:'+STAT))gain+=3;
  const L0=heroLvl(h);S.xp+=gain;h.xp+=gain;const L1=heroLvl(h);h.picks+=L1-L0;H.put(h);
  World.add(gold);Sound.ok();popup('+'+gain+' XP'+(gold?' 🔥':''));
  if(L1>L0){setTimeout(()=>popup('LEVEL UP! Lv '+L1),500);World.burst();Sound.lvl()}else if(area(h,STAT).lvl>before)setTimeout(()=>popup(STAT+' skill up!'),500)}
 else{if(first)S.firstMiss.add(qi);if(hasFeat(h,'wind')&&!S.wind)S.wind=true;else S.streak=0;S.queue.splice(Math.min(3,S.queue.length),0,qi);World.wobble();Sound.no();document.getElementById('card').classList.add('shake')}
 const right=q.type==='type'?q.accept[0]:q.choices[q.answer];
 const fb=document.getElementById('fb');fb.className='fb '+(ok?'ok':'no');
 fb.innerHTML=`<strong>${ok?'Correct!':'Not quite.'}</strong> ${ok?'':`The answer is <b>${right}</b>.`}<p>${q.explain}</p>${ok?'':'<p class="small">This one will come back in a few questions.</p>'}<div class="row"><button class="go" id="nx">Next ▶ <span class="small">(Enter)</span></button></div>`;
 const inp=document.getElementById('ans');if(inp)inp.disabled=true;const c=document.getElementById('check');if(c)c.disabled=true;const kb=document.getElementById('keen');if(kb)kb.remove();
 const nx=document.getElementById('nx');nx.focus();nx.onclick=next;
 app.querySelector('.hud').outerHTML=hud()}
function levelUp(){const h=H.cur();const opts=[{k:'train',label:`+1 ${esc(STAT)} (training)`,desc:`Raise ${esc(STAT)} to level ${area(h,STAT).lvl+1}: +1 more XP per right answer in ${esc(STAT)}.`}];
 Object.keys(FEATS).forEach(f=>{if(FEATS[f].area){if(area(h,STAT).lvl>=3&&!hasFeat(h,'sage:'+STAT))opts.push({k:'sage:'+STAT,label:'Feat: Sage of '+esc(STAT),desc:FEATS.sage.desc})}else if(!hasFeat(h,f))opts.push({k:f,label:'Feat: '+FEATS[f].name,desc:FEATS[f].desc})});
 app.innerHTML=`<div class="card"><h1>⬆️ Level ${heroLvl(h)-h.picks+1}!</h1><p>${esc(h.name)} grows stronger. Choose one:</p><div class="choices">${opts.map((o,i)=>`<button data-o="${i}"><b>${o.label}</b><br><span class="small">${o.desc}</span></button>`).join('')}</div></div>`;
 World.burst();app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.o];if(o.k==='train'){const a=h.areas[STAT]=h.areas[STAT]||{use:0,train:0};a.train++}else h.feats.push(o.k);h.picks--;H.put(h);Sound.lvl();if(S&&S.done)finishScreen();else next()})}
const stamp=()=>new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
function download(name,obj){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}catch(e){}}
function record(score){const h=H.cur();return{studywright_record:1,deck:DECK.id,title:DECK.title,subject:DECK.subject,area:STAT,follows:DECK.follows||null,started:S.started,finished:new Date().toISOString(),
 score_first_try:score,best_streak:S.best,answers:S.answered,questions_total:DECK.questions.length,run_xp:S.xp,
 hero:JSON.parse(JSON.stringify(h)),
 first_try_misses:[...S.firstMiss].map(i=>{const q=DECK.questions[i];return{n:i+1,topic:q.topic||'',q:q.q,answer:q.type==='type'?q.accept[0]:q.choices[q.answer],tries:S.log[i]}}),
 items:DECK.questions.map((q,i)=>({n:i+1,topic:q.topic||'',tries:(S.log[i]||[]).length,first_ok:!!(S.log[i]&&S.log[i][0].ok)}))}}
function finish(){const n=DECK.questions.length;const score=Math.round(100*(n-S.firstMiss.size)/n);
 const rec=store.get(KEY);if(!rec||score>rec.score)store.set(KEY,{score,best:S.best});
 const h=H.cur();h.quests++;H.put(h);S.R=record(score);S.score=score;S.done=true;const all=store.get(RKEY)||[];all.push(S.R);store.set(RKEY,all.slice(-200));
 S.fname='studywright-'+DECK.id+'-'+stamp()+'.json';download(S.fname,S.R);World.burst();Sound.lvl();finishScreen()}
function finishScreen(){const h=H.cur();const score=S.score;const stars=score>=90?3:score>=70?2:1;
 const topics={};S.firstMiss.forEach(i=>{const t=DECK.questions[i].topic||'Other';(topics[t]=topics[t]||[]).push(DECK.questions[i])});
 app.innerHTML=hud()+`<div class="card"><h1>Quest complete! ${'⭐'.repeat(stars)}</h1><p><b>${score}%</b> right on the first try. Top streak: <b>${S.best}</b>. Tower height: <b>${S.correct}</b> blocks. ${esc(h.name)} earned <b>${S.xp} XP</b>.</p>
 ${S.firstMiss.size?`<h2>Review these before the test</h2><ul class="rev">${Object.entries(topics).map(([t,qs])=>`<li><b>${t}</b>: ${qs.map(q=>(q.review||q.q)+' → <b>'+(q.type==='type'?q.accept[0]:q.choices[q.answer])+'</b>').join('<br>')}</li>`).join('')}</ul>`:'<p>Perfect run. You are ready.</p>'}
 <p class="small">Record saved to Downloads as ${S.fname}.</p>
 <div class="row"><button class="go" id="again">Play again ↻</button><button id="save">Save record again 💾</button><button id="home">Character</button></div></div>`;
 document.getElementById('again').onclick=()=>{newRun();World.reset();next()};document.getElementById('save').onclick=()=>download(S.fname,S.R);document.getElementById('home').onclick=sheet;
 if(h.picks>0)setTimeout(levelUp,2500)}
function popup(t){const d=document.createElement('div');d.className='pop';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
document.addEventListener('keydown',e=>{const ae=document.activeElement;if(ae&&ae.tagName==='INPUT')return;if(e.key==='Enter'){const nx=document.getElementById('nx');if(nx&&ae!==nx){e.preventDefault();nx.click()}}
 const k=e.key.toUpperCase().charCodeAt(0)-65;const bs=app.querySelectorAll('#card .choices button');if(e.key.length===1&&k>=0&&k<bs.length&&!bs[k].disabled)bs[k].click()});
// ---------- sound ----------
const Sound=(()=>{let ctx;function tone(f,d,t='sine',when=0){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.12,ctx.currentTime+when);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+when+d);o.connect(g).connect(ctx.destination);o.start(ctx.currentTime+when);o.stop(ctx.currentTime+when+d)}catch(e){}}
 return{ok(){tone(660,.12);tone(990,.18,'sine',.08)},no(){tone(180,.25,'square')},lvl(){[523,659,784,1046].forEach((f,i)=>tone(f,.2,'triangle',i*.09))}}})();
// ---------- 3D tower (three.js; page still works without it) ----------
const World=(()=>{const none={add(){},wobble(){},burst(){},reset(){}};if(!window.THREE)return none;
 try{const cv=document.getElementById('scene');const r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});r.setPixelRatio(Math.min(2,devicePixelRatio));
 const sc=new THREE.Scene();sc.fog=new THREE.Fog(0x0d1020,14,40);const cam=new THREE.PerspectiveCamera(50,1,.1,100);
 sc.add(new THREE.HemisphereLight(0xbcd2ff,0x202040,.9));const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(5,10,7);sc.add(dl);
 const ground=new THREE.Mesh(new THREE.CylinderGeometry(4,4.4,.4,40),new THREE.MeshStandardMaterial({color:0x2a2f55,roughness:.8}));ground.position.y=-.2;sc.add(ground);
 const tower=new THREE.Group();sc.add(tower);const parts=new THREE.Group();sc.add(parts);
 const stars=new THREE.Points(new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute(Array.from({length:900},()=>(Math.random()-.5)*80),3)),new THREE.PointsMaterial({color:0xffffff,size:.08}));sc.add(stars);
 const accent=new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#7aa2ff');
 let wob=0,camY=3;
 function size(){const w=innerWidth,h=innerHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',size);size();
 function add(gold){const n=tower.children.length;const m=new THREE.Mesh(new THREE.BoxGeometry(1.6,.5,1.6),new THREE.MeshStandardMaterial({color:gold?0xffd166:accent.clone().offsetHSL((n*.03)%1,0,0),emissive:gold?0x664400:0x000000,metalness:.3,roughness:.4}));
  m.position.set((Math.random()-.5)*.25,n*.52+6,(Math.random()-.5)*.25);m.rotation.y=n*.35;m.userData.ty=n*.52+.25;tower.add(m)}
 function burst(){const top=tower.children.length*.52;for(let i=0;i<60;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.07,6,6),new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(Math.random(),1,.6)}));p.position.set(0,top,0);p.userData.v=new THREE.Vector3((Math.random()-.5)*.3,Math.random()*.3,(Math.random()-.5)*.3);p.userData.life=80;parts.add(p)}}
 function reset(){tower.clear();parts.clear()}
 let t=0;(function loop(){requestAnimationFrame(loop);t+=.005;
  tower.children.forEach(m=>{m.position.y+=(m.userData.ty-m.position.y)*.15});
  tower.rotation.z=Math.sin(wob*20)*wob*.15;wob*=.92;
  parts.children.slice().forEach(p=>{p.position.add(p.userData.v);p.userData.v.y-=.006;if(--p.userData.life<=0)parts.remove(p)});
  const h=tower.children.length*.52;camY+=((h+3)-camY)*.05;cam.position.set(Math.sin(t)*10,camY+2,Math.cos(t)*10);cam.lookAt(0,Math.max(1,h-1),0);stars.rotation.y=t*.2;r.render(sc,cam)})();
 return{add,wobble(){wob=1},burst,reset}}catch(e){return none}})();
title();
</script>
