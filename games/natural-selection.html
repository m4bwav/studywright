<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survival Tower</title>
<style>
:root{--bg:#0d1020;--panel:#171b33ee;--ink:#eef1ff;--dim:#a8b0d8;--accent:#4cc9f0;--good:#3ddc84;--bad:#ff6b6b;--gold:#ffd166}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:18px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
#scene{position:fixed;inset:0;z-index:0}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:16px;min-height:100%;display:flex;flex-direction:column;gap:12px}
.hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel);border-radius:14px;padding:10px 14px}
.hud b{color:var(--gold)}
.bar{flex:1 1 160px;height:12px;background:#ffffff22;border-radius:8px;overflow:hidden;min-width:120px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .4s}
.card{background:var(--panel);border-radius:18px;padding:20px;box-shadow:0 10px 40px #0008}
.topic{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
h1{margin:.2em 0;font-size:30px} h2{margin:.3em 0 .6em;font-size:23px}
.choices{display:grid;gap:10px}
button{font:inherit;color:var(--ink);background:#ffffff14;border:2px solid #ffffff22;border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;transition:transform .08s,background .2s}
button:hover:not(:disabled){background:#ffffff26;transform:translateY(-1px)}
button:disabled{cursor:default}
button.right{border-color:var(--good);background:#3ddc8433}
button.wrong{border-color:var(--bad);background:#ff6b6b33}
.go{background:var(--accent);border-color:transparent;font-weight:700;text-align:center;color:#0d1020}
input[type=text]{font:inherit;width:100%;padding:12px;border-radius:12px;border:2px solid #ffffff33;background:#0006;color:var(--ink)}
.fb{margin-top:14px;padding:14px;border-radius:12px;display:none}
.fb.ok{display:block;background:#3ddc8422;border-left:5px solid var(--good)}
.fb.no{display:block;background:#ff6b6b22;border-left:5px solid var(--bad)}
.fb strong{font-size:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.row>button{flex:1}
.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:34px;font-weight:800;color:var(--gold);text-shadow:0 2px 12px #000;pointer-events:none;z-index:5;animation:pop 1s forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
ul.rev{padding-left:20px} ul.rev li{margin:6px 0}
.small{font-size:14px;color:var(--dim)}
@media (max-width:520px){html,body{font-size:16px}h2{font-size:20px}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DECK = {"id": "natural-selection", "title": "Survival Tower", "subject": "Science: Evolution and Natural Selection", "accent": "#4cc9f0", "intro": "Darwin, fitness, variation, snails on a beach and mice on dark rocks. Answer right to build your tower.", "questions": [{"topic": "Darwin", "type": "type", "q": "Charles Darwin's discoveries gave rise to Darwin's theory of evolution by ______ ______.", "accept": ["natural selection"], "explain": "Darwin's theory is evolution by natural selection: nature 'selects' who survives and reproduces."}, {"topic": "Vocabulary", "q": "Evolution is the process by which different kinds of living organisms are thought to have ______ and diversified from earlier forms.", "choices": ["developed", "disappeared", "stayed the same", "been built"], "answer": 0, "explain": "Evolution means living things developed and diversified (became many different kinds) from earlier forms over Earth's history."}, {"topic": "Vocabulary", "q": "Natural selection is a process that favors the ______ and reproduction of organisms with traits well adapted to their environment.", "choices": ["survival", "size", "speed", "color"], "answer": 0, "explain": "It favors survival and reproduction. Organisms that fit their environment live longer and have more babies."}, {"topic": "Vocabulary", "type": "type", "q": "Fitness is the ability of an organism to survive and ______.", "accept": ["reproduce", "reproduction", "have offspring"], "explain": "In biology, fitness is not about being strong. It means surviving AND reproducing, passing genes on."}, {"topic": "Key points", "q": "Individuals with characteristics ______ suited to their environment are most likely to survive and reproduce.", "choices": ["best", "least", "randomly", "never"], "answer": 0, "explain": "The best-suited individuals are the most likely to survive and reproduce."}, {"topic": "Key points", "q": "The successful genes are ______ to their offspring.", "choices": ["passed on", "lost", "hidden", "changed back"], "answer": 0, "explain": "Survivors reproduce, so their successful genes are passed on to their offspring."}, {"topic": "Key points", "q": "Those that are ______ adapted to their environment are less likely to survive and reproduce.", "choices": ["poorly", "well", "perfectly", "best"], "answer": 0, "explain": "Poorly adapted organisms are less likely to survive, so their traits become rarer."}, {"topic": "Key points", "q": "Only ______ variation can be passed to the next generation.", "choices": ["genetic", "learned", "injury", "haircut"], "answer": 0, "explain": "Only traits in the genes (DNA) are inherited. A scar or a learned skill is not passed to babies."}, {"topic": "Variation", "q": "For natural selection to work on a population, there must be ______ variation.", "choices": ["genetic", "no", "weather", "food"], "answer": 0, "explain": "If every individual were identical, nature would have nothing to choose between. Genetic variation is required."}, {"topic": "Reproduction", "q": "Asexual reproduction: offspring are...", "choices": ["genetically identical to the parent (NO variation)", "different from each other and from the parents", "always stronger than the parent", "a mix of two parents' genes"], "answer": 0, "explain": "Asexual reproduction uses one parent and makes copies, so there is no variation."}, {"topic": "Reproduction", "q": "Sexual reproduction: offspring...", "choices": ["HAVE variation from each other and their parents", "are exact copies of one parent", "have no genes", "are all identical twins"], "answer": 0, "explain": "Sexual reproduction mixes genes from two parents, so offspring differ from their parents and even from their siblings."}, {"topic": "Reproduction", "q": "Sexual reproduction results in a ______ of the parents' genes.", "choices": ["mix (combination)", "copy of one parent", "loss", "doubling"], "answer": 0, "explain": "Each baby gets a mix of genes from both parents, which is why siblings look different."}, {"topic": "Reproduction", "q": "Evolution by natural selection happens much ______ in organisms that reproduce sexually.", "choices": ["faster", "slower", "never", "backward"], "answer": 0, "explain": "Sexual reproduction creates more genetic variation, and more variation gives natural selection more to work with, so evolution happens faster."}, {"topic": "Mutation", "type": "type", "q": "A ______ is a change in DNA when it replicates (copies itself). It can make traits not found in the parents.", "accept": ["mutation", "mutations"], "explain": "Mutations are copying changes in DNA. They are a source of brand new traits."}, {"topic": "Key takeaways", "q": "Natural selection leads to changes in ______ over time, NOT individuals.", "choices": ["populations", "one animal's body", "the weather", "rocks"], "answer": 0, "explain": "One snail cannot change its color. The POPULATION changes as more brown snails survive and have babies."}, {"topic": "Key takeaways", "q": "Traits that help organisms survive and reproduce become more ______.", "choices": ["common", "rare", "harmful", "invisible"], "answer": 0, "explain": "Helpful traits get passed on more often, so they become more common in the population."}, {"topic": "Key takeaways", "type": "type", "q": "This process happens over many ______.", "accept": ["generations", "generation"], "explain": "Natural selection is slow: it takes many generations for a trait to spread."}, {"topic": "How it works", "q": "Step 1 of natural selection: ______ exists in a population.", "choices": ["Variation", "A predator", "Evolution", "Extinction"], "answer": 0, "explain": "Step 1: variation (differences between individuals) exists. Step 2: the helpful ones survive and reproduce more. Step 3: those traits become common."}, {"topic": "How it works", "q": "Put the steps in order.", "choices": ["Variation exists → helpful traits survive and reproduce more → those traits become common", "Traits become common → variation exists → survival", "Survival → extinction → variation", "Organisms decide to change → they change → babies change"], "answer": 0, "explain": "Variation, then differential survival and reproduction, then the trait becomes common in the population over generations. Organisms do NOT choose to change."}, {"topic": "Snail example", "q": "A beach of mostly brown sand has blue, green, red and brown snails. Which snails would a bird most likely see?", "choices": ["Blue, green and red", "Brown", "All equally", "None"], "answer": 0, "explain": "Blue, green and red stand out against brown sand. Brown snails are camouflaged."}, {"topic": "Snail example", "q": "Which colored snail is better adapted to the brown beach?", "choices": ["Brown", "Red", "Blue", "Green"], "answer": 0, "explain": "Brown snails blend in, so birds miss them."}, {"topic": "Snail example", "q": "Which snails will most likely survive long enough to reproduce, and what color will most offspring be?", "choices": ["Brown survive, mostly brown offspring", "Red survive, mostly red offspring", "All survive, mixed offspring", "Brown survive, mostly blue offspring"], "answer": 0, "explain": "Brown snails survive and pass on brown genes, so over generations the population becomes mostly brown."}, {"topic": "Mice example", "q": "Mice move to an area with very dark rocks. Some mice are black, others tan. What happens?", "choices": ["Tan mice are seen and eaten more; the next generation has more black mice", "Black mice are eaten more; mice become tan", "Tan mice turn black to hide", "Nothing changes"], "answer": 0, "explain": "Tan mice stand out on dark rock, so birds eat more of them. Black mice survive, reproduce, and each generation has a higher share of black mice."}, {"topic": "Mice example", "q": "A tan mouse on dark rocks cannot become black during its life. Why does the population still get darker?", "choices": ["More black mice survive and pass on their genes", "The tan mice learn to be black", "The sun darkens them", "Birds paint them"], "answer": 0, "explain": "Individuals don't change; the population does, because black mice have more babies."}]};
// ---------- state ----------
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const KEY='studywright:'+DECK.id;
let S;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return String(s).toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function lev(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]}
function typedOk(q,v){const n=norm(v);if(!n)return false;return q.accept.some(a=>{const t=norm(a);return n===t||(t.length>4&&lev(n,t)<=Math.floor(t.length/5))})}
function newRun(){S={queue:shuffle(DECK.questions.map((_,i)=>i)),mastered:new Set(),firstMiss:new Set(),seen:new Set(),xp:0,streak:0,best:0,answered:0,correct:0}}
const app=document.getElementById('app');
function hud(){const lvl=1+Math.floor(S.xp/100);const pct=100*S.mastered.size/DECK.questions.length;
 return `<div class="hud"><span>Lv <b>${lvl}</b></span><span>XP <b>${S.xp}</b></span><span>Streak <b>${S.streak}</b>${S.streak>=3?' 🔥':''}</span><div class="bar" title="mastered"><i style="width:${pct}%"></i></div><span class="small">${S.mastered.size}/${DECK.questions.length} mastered</span></div>`}
// ---------- screens ----------
function title(){const rec=store.get(KEY);
 app.innerHTML=`<div class="card"><div class="topic">${DECK.subject}</div><h1>${DECK.title}</h1><p>${DECK.intro}</p>
 <p class="small">Every right answer stacks a block on your tower. Streaks of 3+ make gold blocks and double XP. Miss one and it comes back later until you get it. Finish when every question is mastered.</p>
 ${rec?`<p class="small">Best so far: ${rec.score}% right on first try, top streak ${rec.best}.</p>`:''}
 <div class="row"><button class="go" id="start">Start quest ▶</button></div></div>`;
 document.getElementById('start').onclick=()=>{newRun();World.reset();next()}}
function next(){if(!S.queue.length)return finish();const qi=S.queue[0];const q=DECK.questions[qi];
 let body='';
 if(q.type==='type'){body=`<input type="text" id="ans" autocomplete="off" placeholder="Type your answer"><div class="row"><button class="go" id="check">Check</button></div>`}
 else{const order=shuffle(q.choices.map((c,i)=>i));body=`<div class="choices">${order.map((i,k)=>`<button data-i="${i}">${String.fromCharCode(65+k)}. ${q.choices[i]}</button>`).join('')}</div>`}
 app.innerHTML=hud()+`<div class="card" id="card"><div class="topic">${q.topic||''}</div><h2>${q.q}</h2>${body}<div class="fb" id="fb"></div></div>`;
 if(q.type==='type'){const inp=document.getElementById('ans');inp.focus();const go=()=>answer(qi,typedOk(q,inp.value),inp.value);document.getElementById('check').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()}}
 else app.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>{const pick=+b.dataset.i;app.querySelectorAll('.choices button').forEach(x=>{x.disabled=true;if(+x.dataset.i===q.answer)x.classList.add('right')});if(pick!==q.answer)b.classList.add('wrong');answer(qi,pick===q.answer,q.choices[pick])})}
function answer(qi,ok,given){const q=DECK.questions[qi];S.queue.shift();S.answered++;
 const first=!S.seen.has(qi);S.seen.add(qi);
 if(ok){S.correct++;S.streak++;S.best=Math.max(S.best,S.streak);S.mastered.add(qi);const gain=(S.streak>=3?20:10);const before=Math.floor(S.xp/100);S.xp+=gain;
  World.add(S.streak>=3);Sound.ok();popup('+'+gain+' XP'+(S.streak>=3?' 🔥':''));if(Math.floor(S.xp/100)>before){setTimeout(()=>popup('LEVEL UP!'),500);World.burst();Sound.lvl()}}
 else{if(first)S.firstMiss.add(qi);S.streak=0;S.queue.splice(Math.min(3,S.queue.length),0,qi);World.wobble();Sound.no();document.getElementById('card').classList.add('shake')}
 const right=q.type==='type'?q.accept[0]:q.choices[q.answer];
 const fb=document.getElementById('fb');fb.className='fb '+(ok?'ok':'no');
 fb.innerHTML=`<strong>${ok?'Correct!':'Not quite.'}</strong> ${ok?'':`The answer is <b>${right}</b>.`}<p>${q.explain}</p>${ok?'':'<p class="small">This one will come back in a few questions.</p>'}<div class="row"><button class="go" id="nx">Next ▶ <span class="small">(Enter)</span></button></div>`;
 const inp=document.getElementById('ans');if(inp)inp.disabled=true;const c=document.getElementById('check');if(c)c.disabled=true;
 const nx=document.getElementById('nx');nx.focus();nx.onclick=next;
 app.querySelector('.hud').outerHTML=hud()}
function finish(){const n=DECK.questions.length;const score=Math.round(100*(n-S.firstMiss.size)/n);const stars=score>=90?3:score>=70?2:1;
 const rec=store.get(KEY);if(!rec||score>rec.score)store.set(KEY,{score,best:S.best});
 const topics={};S.firstMiss.forEach(i=>{const t=DECK.questions[i].topic||'Other';(topics[t]=topics[t]||[]).push(DECK.questions[i])});
 World.burst();Sound.lvl();
 app.innerHTML=hud()+`<div class="card"><h1>Quest complete! ${'⭐'.repeat(stars)}</h1><p><b>${score}%</b> right on the first try. Top streak: <b>${S.best}</b>. Tower height: <b>${S.correct}</b> blocks.</p>
 ${S.firstMiss.size?`<h2>Review these before the test</h2><ul class="rev">${Object.entries(topics).map(([t,qs])=>`<li><b>${t}</b>: ${qs.map(q=>(q.review||q.q)+' → <b>'+(q.type==='type'?q.accept[0]:q.choices[q.answer])+'</b>').join('<br>')}</li>`).join('')}</ul>`:'<p>Perfect run. You are ready.</p>'}
 <div class="row"><button class="go" id="again">Play again ↻</button></div></div>`;
 document.getElementById('again').onclick=()=>{newRun();World.reset();next()}}
function popup(t){const d=document.createElement('div');d.className='pop';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const nx=document.getElementById('nx');if(nx&&document.activeElement!==nx){e.preventDefault();nx.click()}}
 const k=e.key.toUpperCase().charCodeAt(0)-65;const bs=app.querySelectorAll('.choices button');if(e.key.length===1&&k>=0&&k<bs.length&&!bs[k].disabled)bs[k].click()});
// ---------- sound ----------
const Sound=(()=>{let ctx;function tone(f,d,t='sine',when=0){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.12,ctx.currentTime+when);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+when+d);o.connect(g).connect(ctx.destination);o.start(ctx.currentTime+when);o.stop(ctx.currentTime+when+d)}catch(e){}}
 return{ok(){tone(660,.12);tone(990,.18,'sine',.08)},no(){tone(180,.25,'square')},lvl(){[523,659,784,1046].forEach((f,i)=>tone(f,.2,'triangle',i*.09))}}})();
// ---------- 3D tower (three.js; page still works without it) ----------
const World=(()=>{const none={add(){},wobble(){},burst(){},reset(){}};if(!window.THREE)return none;
 try{const cv=document.getElementById('scene');const r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});r.setPixelRatio(Math.min(2,devicePixelRatio));
 const sc=new THREE.Scene();sc.fog=new THREE.Fog(0x0d1020,14,40);const cam=new THREE.PerspectiveCamera(50,1,.1,100);
 sc.add(new THREE.HemisphereLight(0xbcd2ff,0x202040,.9));const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(5,10,7);sc.add(dl);
 const ground=new THREE.Mesh(new THREE.CylinderGeometry(4,4.4,.4,40),new THREE.MeshStandardMaterial({color:0x2a2f55,roughness:.8}));ground.position.y=-.2;sc.add(ground);
 const tower=new THREE.Group();sc.add(tower);const parts=new THREE.Group();sc.add(parts);
 const stars=new THREE.Points(new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute(Array.from({length:900},()=>(Math.random()-.5)*80),3)),new THREE.PointsMaterial({color:0xffffff,size:.08}));sc.add(stars);
 const accent=new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#7aa2ff');
 let wob=0,camY=3;
 function size(){const w=innerWidth,h=innerHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',size);size();
 function add(gold){const n=tower.children.length;const m=new THREE.Mesh(new THREE.BoxGeometry(1.6,.5,1.6),new THREE.MeshStandardMaterial({color:gold?0xffd166:accent.clone().offsetHSL((n*.03)%1,0,0),emissive:gold?0x664400:0x000000,metalness:.3,roughness:.4}));
  m.position.set((Math.random()-.5)*.25,n*.52+6,(Math.random()-.5)*.25);m.rotation.y=n*.35;m.userData.ty=n*.52+.25;tower.add(m)}
 function burst(){const top=tower.children.length*.52;for(let i=0;i<60;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.07,6,6),new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(Math.random(),1,.6)}));p.position.set(0,top,0);p.userData.v=new THREE.Vector3((Math.random()-.5)*.3,Math.random()*.3,(Math.random()-.5)*.3);p.userData.life=80;parts.add(p)}}
 function reset(){tower.clear();parts.clear()}
 let t=0;(function loop(){requestAnimationFrame(loop);t+=.005;
  tower.children.forEach(m=>{m.position.y+=(m.userData.ty-m.position.y)*.15});
  tower.rotation.z=Math.sin(wob*20)*wob*.15;wob*=.92;
  parts.children.slice().forEach(p=>{p.position.add(p.userData.v);p.userData.v.y-=.006;if(--p.userData.life<=0)parts.remove(p)});
  const h=tower.children.length*.52;camY+=((h+3)-camY)*.05;cam.position.set(Math.sin(t)*10,camY+2,Math.cos(t)*10);cam.lookAt(0,Math.max(1,h-1),0);stars.rotation.y=t*.2;r.render(sc,cam)})();
 return{add,wobble(){wob=1},burst,reset}}catch(e){return none}})();
title();
</script>
</body>
</html>
