<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survival Tower</title>
<style>
:root{--bg:#0d1020;--panel:#171b33ee;--ink:#eef1ff;--dim:#a8b0d8;--accent:#4cc9f0;--good:#3ddc84;--bad:#ff6b6b;--gold:#ffd166}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:18px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
#scene{position:fixed;inset:0;z-index:0}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:16px;min-height:100%;display:flex;flex-direction:column;gap:12px}
.hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel);border-radius:14px;padding:10px 14px}
.hud b{color:var(--gold)}
.bar{flex:1 1 160px;height:12px;background:#ffffff22;border-radius:8px;overflow:hidden;min-width:120px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .4s}
.card{background:var(--panel);border-radius:18px;padding:20px;box-shadow:0 10px 40px #0008}
.topic{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
h1{margin:.2em 0;font-size:30px} h2{margin:.3em 0 .6em;font-size:23px}
.choices{display:grid;gap:10px}
button{font:inherit;color:var(--ink);background:#ffffff14;border:2px solid #ffffff22;border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;transition:transform .08s,background .2s}
button:hover:not(:disabled){background:#ffffff26;transform:translateY(-1px)}
button:disabled{cursor:default}
button.right{border-color:var(--good);background:#3ddc8433}
button.wrong{border-color:var(--bad);background:#ff6b6b33}
.go{background:var(--accent);border-color:transparent;font-weight:700;text-align:center;color:#0d1020}
input[type=text]{font:inherit;width:100%;padding:12px;border-radius:12px;border:2px solid #ffffff33;background:#0006;color:var(--ink)}
.fb{margin-top:14px;padding:14px;border-radius:12px;display:none}
.fb.ok{display:block;background:#3ddc8422;border-left:5px solid var(--good)}
.fb.no{display:block;background:#ff6b6b22;border-left:5px solid var(--bad)}
.fb strong{font-size:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.row>button{flex:1}
.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:34px;font-weight:800;color:var(--gold);text-shadow:0 2px 12px #000;pointer-events:none;z-index:5;animation:pop 1s forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}
.timer i{background:linear-gradient(90deg,var(--bad),var(--gold));transition:width .25s linear}
.boss{border:2px solid var(--bad)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
ul.rev{padding-left:20px} ul.rev li{margin:6px 0}
.scene{font-style:italic;background:#0005;border-left:4px solid var(--accent);border-radius:8px;padding:8px 12px;margin:8px 0}
.small{font-size:14px;color:var(--dim)}
.hero{display:flex;gap:12px;align-items:center;background:#ffffff0d;border-radius:12px;padding:10px;margin-top:10px}.hero .big{font-size:40px}
button.struck{opacity:.35;text-decoration:line-through}
a{color:var(--accent)}
.stage{position:relative;height:150px;border-radius:12px;overflow:hidden;margin:8px 0;background:linear-gradient(#0000,#0006),var(--sky,#1a2a3a)}
.stage .gnd{position:absolute;left:0;right:0;bottom:0;height:34px;background:var(--gnd,#2d5a2a)}
.stage .ha{position:absolute;left:12%;bottom:18px;width:96px;height:120px;transition:transform .35s}
.stage .foe{position:absolute;right:14%;bottom:24px;font-size:70px;line-height:1;transition:transform .35s,opacity .5s,filter .3s}
.stage .fx{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-size:26px;font-weight:800;text-shadow:0 2px 8px #000;opacity:0}
.stage.win .ha{transform:translateX(150%)}.stage.win .foe{transform:translate(60px,-30px) rotate(35deg);opacity:0}
.stage.win .fx{color:var(--gold);animation:fxup 1.6s forwards}.stage.lose .fx{color:var(--bad);animation:fxup 1.6s forwards}
.stage.lose .foe{animation:lunge .5s}.stage.lose .ha{animation:hurt .6s;filter:drop-shadow(0 0 10px #f33)}
@keyframes fxup{0%{opacity:0;top:40%}20%{opacity:1}80%{opacity:1}100%{opacity:0;top:5%}}
@keyframes lunge{50%{transform:translateX(-160px) scale(1.2)}}
@keyframes hurt{20%,60%{transform:translateX(-14px) rotate(-8deg)}40%,80%{transform:translateX(6px)}}
.wait{opacity:.55}
.inv{display:flex;flex-wrap:wrap;gap:6px}.inv span{background:#ffffff14;border-radius:8px;padding:3px 8px;font-size:14px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}.opts button{padding:6px 10px;font-size:15px}.opts button.sel{border-color:var(--gold);background:#ffd16633}
.sw{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:middle;border:1px solid #fff6}
.step{border:2px dashed var(--gold)}
@media (max-width:520px){html,body{font-size:16px}h2{font-size:20px}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DECK = {"id": "natural-selection", "title": "Survival Tower", "subject": "Science: Evolution and Natural Selection", "accent": "#4cc9f0", "realm": "biology", "intro": "Darwin, fitness, variation, snails on a beach and mice on dark rocks. Answer right to build your tower.", "questions": [{"topic": "Darwin", "type": "type", "q": "Charles Darwin's discoveries gave rise to Darwin's theory of evolution by ______ ______.", "accept": ["natural selection"], "explain": "Darwin's theory is evolution by natural selection: nature 'selects' who survives and reproduces."}, {"topic": "Vocabulary", "q": "Evolution is the process by which different kinds of living organisms are thought to have ______ and diversified from earlier forms.", "choices": ["developed", "disappeared", "stayed the same", "been built"], "answer": 0, "explain": "Evolution means living things developed and diversified (became many different kinds) from earlier forms over Earth's history."}, {"topic": "Vocabulary", "q": "Natural selection is a process that favors the ______ and reproduction of organisms with traits well adapted to their environment.", "choices": ["survival", "size", "speed", "color"], "answer": 0, "explain": "It favors survival and reproduction. Organisms that fit their environment live longer and have more babies."}, {"topic": "Vocabulary", "type": "type", "q": "Fitness is the ability of an organism to survive and ______.", "accept": ["reproduce", "reproduction", "have offspring"], "explain": "In biology, fitness is not about being strong. It means surviving AND reproducing, passing genes on."}, {"topic": "Key points", "q": "Individuals with characteristics ______ suited to their environment are most likely to survive and reproduce.", "choices": ["best", "least", "randomly", "never"], "answer": 0, "explain": "The best-suited individuals are the most likely to survive and reproduce."}, {"topic": "Key points", "q": "The successful genes are ______ to their offspring.", "choices": ["passed on", "lost", "hidden", "changed back"], "answer": 0, "explain": "Survivors reproduce, so their successful genes are passed on to their offspring."}, {"topic": "Key points", "q": "Those that are ______ adapted to their environment are less likely to survive and reproduce.", "choices": ["poorly", "well", "perfectly", "best"], "answer": 0, "explain": "Poorly adapted organisms are less likely to survive, so their traits become rarer."}, {"topic": "Key points", "q": "Only ______ variation can be passed to the next generation.", "choices": ["genetic", "learned", "injury", "haircut"], "answer": 0, "explain": "Only traits in the genes (DNA) are inherited. A scar or a learned skill is not passed to babies."}, {"topic": "Variation", "q": "For natural selection to work on a population, there must be ______ variation.", "choices": ["genetic", "no", "weather", "food"], "answer": 0, "explain": "If every individual were identical, nature would have nothing to choose between. Genetic variation is required."}, {"topic": "Reproduction", "q": "Asexual reproduction: offspring are...", "choices": ["genetically identical to the parent (NO variation)", "different from each other and from the parents", "always stronger than the parent", "a mix of two parents' genes"], "answer": 0, "explain": "Asexual reproduction uses one parent and makes copies, so there is no variation."}, {"topic": "Reproduction", "q": "Sexual reproduction: offspring...", "choices": ["HAVE variation from each other and their parents", "are exact copies of one parent", "have no genes", "are all identical twins"], "answer": 0, "explain": "Sexual reproduction mixes genes from two parents, so offspring differ from their parents and even from their siblings."}, {"topic": "Reproduction", "q": "Sexual reproduction results in a ______ of the parents' genes.", "choices": ["mix (combination)", "copy of one parent", "loss", "doubling"], "answer": 0, "explain": "Each baby gets a mix of genes from both parents, which is why siblings look different."}, {"topic": "Reproduction", "q": "Evolution by natural selection happens much ______ in organisms that reproduce sexually.", "choices": ["faster", "slower", "never", "backward"], "answer": 0, "explain": "Sexual reproduction creates more genetic variation, and more variation gives natural selection more to work with, so evolution happens faster."}, {"topic": "Mutation", "type": "type", "q": "A ______ is a change in DNA when it replicates (copies itself). It can make traits not found in the parents.", "accept": ["mutation", "mutations"], "explain": "Mutations are copying changes in DNA. They are a source of brand new traits."}, {"topic": "Key takeaways", "q": "Natural selection leads to changes in ______ over time, NOT individuals.", "choices": ["populations", "one animal's body", "the weather", "rocks"], "answer": 0, "explain": "One snail cannot change its color. The POPULATION changes as more brown snails survive and have babies."}, {"topic": "Key takeaways", "q": "Traits that help organisms survive and reproduce become more ______.", "choices": ["common", "rare", "harmful", "invisible"], "answer": 0, "explain": "Helpful traits get passed on more often, so they become more common in the population."}, {"topic": "Key takeaways", "type": "type", "q": "This process happens over many ______.", "accept": ["generations", "generation"], "explain": "Natural selection is slow: it takes many generations for a trait to spread."}, {"topic": "How it works", "q": "Step 1 of natural selection: ______ exists in a population.", "choices": ["Variation", "A predator", "Evolution", "Extinction"], "answer": 0, "explain": "Step 1: variation (differences between individuals) exists. Step 2: the helpful ones survive and reproduce more. Step 3: those traits become common."}, {"topic": "How it works", "q": "Put the steps in order.", "choices": ["Variation exists → helpful traits survive and reproduce more → those traits become common", "Traits become common → variation exists → survival", "Survival → extinction → variation", "Organisms decide to change → they change → babies change"], "answer": 0, "explain": "Variation, then differential survival and reproduction, then the trait becomes common in the population over generations. Organisms do NOT choose to change."}, {"topic": "Snail example", "q": "A beach of mostly brown sand has blue, green, red and brown snails. Which snails would a bird most likely see?", "choices": ["Blue, green and red", "Brown", "All equally", "None"], "answer": 0, "explain": "Blue, green and red stand out against brown sand. Brown snails are camouflaged."}, {"topic": "Snail example", "q": "Which colored snail is better adapted to the brown beach?", "choices": ["Brown", "Red", "Blue", "Green"], "answer": 0, "explain": "Brown snails blend in, so birds miss them."}, {"topic": "Snail example", "q": "Which snails will most likely survive long enough to reproduce, and what color will most offspring be?", "choices": ["Brown survive, mostly brown offspring", "Red survive, mostly red offspring", "All survive, mixed offspring", "Brown survive, mostly blue offspring"], "answer": 0, "explain": "Brown snails survive and pass on brown genes, so over generations the population becomes mostly brown."}, {"topic": "Mice example", "q": "Mice move to an area with very dark rocks. Some mice are black, others tan. What happens?", "choices": ["Tan mice are seen and eaten more; the next generation has more black mice", "Black mice are eaten more; mice become tan", "Tan mice turn black to hide", "Nothing changes"], "answer": 0, "explain": "Tan mice stand out on dark rock, so birds eat more of them. Black mice survive, reproduce, and each generation has a higher share of black mice."}, {"topic": "Mice example", "q": "A tan mouse on dark rocks cannot become black during its life. Why does the population still get darker?", "choices": ["More black mice survive and pass on their genes", "The tan mice learn to be black", "The sun darkens them", "Birds paint them"], "answer": 0, "explain": "Individuals don't change; the population does, because black mice have more babies."}]};

 const sw=walk?Math.sin(t*15):0,bob=walk||K.still?0:Math.sin(t*2.4)*.45,back=face==='u',ex=face==='l'?-1.3:face==='r'?1.3:0;

 c.save();c.translate(x,y);c.scale(u,u);c.fillStyle='#0005';c.beginPath();c.ellipse(0,0,7.5,2.4,0,0,7);c.fill();c.scale(sx,sy);c.translate(0,bob);

  else if(g==='Bow'){c.strokeStyle='#8a5a2a';c.lineWidth=1.2;c.beginPath();c.arc(gx-2,gy-3,8,-1.1,1.1);c.stroke();Ln(gx+1.6,gy-10,gx+1.6,gy+4,'#ddd',.4)}

  else if(g==='Slingshot'){Ln(gx,gy+3,gx,gy-3,'#8a5a2a',1.2);Ln(gx,gy-3,gx-2.5,gy-7,'#8a5a2a',1.2);Ln(gx,gy-3,gx+2.5,gy-7,'#8a5a2a',1.2)}
  else if(g==='Sword'){Ln(gx,gy,gx,gy-15,'#e3e8f4',1.6);Ln(gx-2.6,gy-1,gx+2.6,gy-1,'#b08d3a',1.3)}
  else if(g==='Hammer'){Ln(gx,gy+5,gx,gy-12,'#8a5a2a',1.2);R(gx-3.5,gy-15,7,4,'#9aa0ad',.8)}

  else if(g==='Staff'){Ln(gx,gy+8,gx,gy-15,'#8a5a2a',1.2);C(gx,gy-16.5,2.4,'#7cf')}
  else if(g==='Wand'){Ln(gx,gy,gx+3,gy-7,'#eee',.9);C(gx+3,gy-7,1.2,'#ffd166')}

 if(!back){C(-2.3+ex,-24,1,'#1c1c22');C(2.3+ex,-24,1,'#1c1c22');C(-2+ex,-24.3,.35,'#fff');C(2.6+ex,-24.3,.35,'#fff');const f=L.face||'Smile';
  if(f==='Grin')R(-2+ex,-21.6,4,1.6,'#fff',.7);else if(f==='Serious')Ln(-1.6+ex,-20.8,1.6+ex,-20.8,'#522',.6);else{c.strokeStyle='#522';c.lineWidth=.6;c.beginPath();c.arc(ex,-22,2.2,.25*Math.PI,.75*Math.PI);c.stroke()}
  if(f==='Freckles')[[-3.6,-22.4],[-4.4,-21.6],[3.6,-22.4],[4.4,-21.6]].forEach(p=>C(p[0]+ex,p[1],.35,'#8a4a2a'))}

 else if(hc==='Knight'){c.fillStyle='#c0c8d8';c.beginPath();c.arc(0,-25.4,7,Math.PI,0);c.closePath();c.fill();R(-7,-26,14,1.6,'#9aa3b8');R(-.8,-36,1.6,5,of)}
 else if(hc==='Ranger'||hc==='Hood'){c.fillStyle=hc==='Hood'?of:'#3a5a2a';c.beginPath();c.arc(0,-25.4,7.4,Math.PI,0);c.closePath();c.fill();c.beginPath();c.moveTo(-3.4,-31.4);c.lineTo(0,-36);c.lineTo(3.4,-31.4);c.closePath();c.fill()}
 else if(hc==='Scholar'){P([[-8,-31],[0,-34.5],[8,-31],[0,-27.5]],'#20222c');R(-4.5,-31,9,3,'#20222c');Ln(6,-31,7,-27,'#ffd166',.6)}
 else if(hc==='Cap'){c.fillStyle=of;c.beginPath();c.arc(0,-26,6.9,Math.PI,0);c.closePath();c.fill();R(back?-9:1,-27.2,8.5,1.8,of,.9)}
 else if(hc==='Crown')P([[-5.5,-29],[-5.5,-35],[-2.8,-32],[0,-36.5],[2.8,-32],[5.5,-35],[5.5,-29]],'#ffd166');
 else if(hc==='Headband')R(-6.6,-28.4,13.2,1.8,of,.6);
 if(back)cape();c.restore()}
function heroCanvas(h,w,hh,u){const cv=document.createElement('canvas');cv.width=w;cv.height=hh;drawHero(cv.getContext('2d'),w/2,hh-6,u,h,0,false,'d');return cv}
