<style>
:root{--ac:#ff9f43;--bg:#0b0e1a;--card:#161b2e;--ink:#e8ecf8;--dim:#9aa3bd}

.builder{display:flex;gap:16px;flex-wrap:wrap}.builder .pv{text-align:center}.builder .pv canvas{background:radial-gradient(#2b3560,#141a30);border-radius:14px}

#pad{position:fixed;right:14px;bottom:14px;z-index:6;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;opacity:.8}

text><circle cx=\"176\" cy=\"122\" r=\"13\" fill=\"#fff\" stroke=\"#1b2340\" stroke-width=\"2\"/><text x=\"176\" y=\"127\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#1b2340\">4<\/text><circle cx=\"296\" cy=\"138\" r=\"13\" fill=\"#fff\" stroke=\"#1b2340\" stroke-width=\"2\"/><text x=\"296\" y=\"143\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#1b2340\">3<\/text><circle cx=\"138\" cy=\"196\" r=\"13\" fill=\"#fff\" stroke=\"#1b2340\" stroke-width=\"2\"/><text x=\"138\" y=\"201\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#1b2340\">5<\/text><text x=\"8\" y=\"230\" font-size=\"11\" font-style=\"italic\" fill=\"#1b2340\">Pacific<\/text><text x=\"8\" y=\"243\" font-size=\"11\" font-style=\"italic\" fill=\"#1b2340\">Ocean<\/text><text x=\"362\" y=\"180\" font-size=\"11\" font-style=\"italic\" fill=\"#1b2340\">Atlantic<\/text><text x=\"366\" y=\"193\" font-size=\"11\" font-style=\"italic\" fill=\"#1b2340\">Ocean<\/text><text x=\"248\" y=\"246\" font-size=\"11\" font-style=\"italic\" fill=\"#1b2340\">Gulf of<\/text><text x=\"248\" y=\"259\" font-size=\"11\" font-style=\"italic\" fill=\"#1b2340\">Mexico<\/text><\/svg>"}, "regions": [{"id": "dolores", "name": "Dolores Plaza", "biome": "town", "teach": ["<b>Part 2: Father Hidalgo and Mexican Independence.<\/b> Mexicans were unhappy with Spanish rule: men <b>born in Spain got the best jobs<\/b>, <b>high taxes<\/b> paid for wars in Europe, and they were <b>ruled by someone far away in Europe<\/b>.", "Father Hidalgo was a Catholic <b>priest<\/b> in the town of <b>Dolores<\/b>. He was born in <b>1753<\/b>.", "The <b>Grito de Dolores<\/b> happened on <b>September 16, 1810<\/b>: his call for the people of Mexico to rise up against Spanish rule.", "Problems that hurt his army: <b>lack of discipline<\/b>, <b>no military training<\/b>, and it <b>failed to capture Mexico City<\/b>.", "Hidalgo was captured and executed in <b>1811<\/b>. Mexico finally won independence in <b>1821<\/b>. He is the <b>Father of Mexican Independence<\/b>."], "merchant": {"name": "Plaza trader", "icon": "🧔", "hello": "Welcome to Dolores! Everything on my table has a story.", "goods": [{"icon": "🔔", "name": "Bell of Dolores", "fact": "On September 16, 1810, in the town of Dolores, Father Hidalgo gave the Grito de Dolores: his call for the people of Mexico to rise up against Spanish rule."}, {"icon": "🕯️", "name": "Priest's Candle", "fact": "Father Hidalgo was a Catholic priest, born in 1753. He was captured and executed in 1811. Mexico won independence in 1821, and he is called the Father of Mexican Independence."}]}}, {"id": "bigpic", "name": "Big Picture Mesa", "biome": "wild", "teach": ["<b>Part 1: The Big Picture.<\/b> The Seven Years' War (1754-1763) is also called the <b>French and Indian<\/b> War.", "After the war, <b>Great Britain<\/b> gained Canada and all land <b>east<\/b> of the Mississippi River. <b>Spain<\/b> got New Orleans and all French land <b>west<\/b> of it. France lost; the United States did not exist yet.", "Rubí suggested closing all missions in Texas except <b>Goliad<\/b> and <b>San Antonio<\/b>.", "The Louisiana Purchase: <b>1803<\/b>, President <b>Thomas Jefferson<\/b>, <b>$15 million<\/b>, <b>doubled<\/b> the size of the United States.", "Map of 1803: 1 = <b>Oregon Territory<\/b>, 2 = <b>British North America<\/b>, 3 = <b>United States<\/b>, 4 = <b>Louisiana Purchase<\/b>, 5 = <b>New Spain<\/b>."], "merchant": {"name": "Mesa fur trader", "icon": "🧑‍🦰", "hello": "I have traded on both sides of the Mississippi. Ask me who owned what.", "goods": [{"icon": "🦫", "name": "Beaver Pelt", "fact": "The Seven Years' War (1754-1763) is also called the French and Indian War. After it, Great Britain gained Canada and all land east of the Mississippi River. Spain got New Orleans and the French land west of it."}, {"icon": "🧾", "name": "Louisiana Receipt", "fact": "The Louisiana Purchase: in 1803 President Thomas Jefferson paid $15 million, and it doubled the size of the United States."}]}}, {"id": "filib", "name": "Filibuster Trail", "biome": "ranch", "teach": ["<b>Part 3: Filibusters.<\/b> The four parts: from a <b>foreign<\/b> country (not Spanish); came to <b>fight<\/b> the <b>government<\/b>; wanted <b>land<\/b> and <b>power<\/b>; wanted personal <b>gain<\/b> (<b>wealth<\/b>).", "All four must be true. If one is missing the answer is NO, and the missing part is the reason.", "<b>Filibusters:<\/b> Philip Nolan, Augustus Magee, James Long.", "<b>NO:<\/b> Father Hidalgo (not foreign, no personal gain). Moses Austin and Stephen F. Austin (did not fight the government; they asked permission)."], "merchant": {"name": "Trail horse trader", "icon": "🤠", "hello": "Careful on this trail. Some men ride into Texas without asking anyone.", "goods": [{"icon": "🐎", "name": "Mustang Charm", "fact": "A filibuster has all four parts: from a foreign country, came to fight the government, wanted land and power, and wanted personal gain. Philip Nolan, Augustus Magee and James Long were filibusters."}, {"icon": "🚩", "name": "Torn Flag", "fact": "If one of the four parts is missing, the answer is NO. Father Hidalgo was not a filibuster: he was not foreign and wanted no personal gain. Moses and Stephen F. Austin were not: they asked permission and did not fight the government."}]}}, {"id": "colony", "name": "Austin's Colony", "biome": "farm", "teach": ["<b>Part 4: Empresarios.<\/b> An empresario was a <b>land agent<\/b> who brought settlers into Texas in exchange for <b>land<\/b>.", "1820: Spain opened Texas to foreign settlers. They had to <b>be Catholic<\/b> (or convert), <b>be hard-working<\/b> and <b>become citizens<\/b>.", "Mexico wanted settlers to <b>protect Texas<\/b> from United States expansion and hostile Indians. Anglo-Americans came for <b>cheap land<\/b> and to <b>escape debt<\/b>.", "1821: <b>Moses Austin<\/b> was promised a contract for 300 Catholic families but died. <b>Stephen F. Austin<\/b> took it over: the <b>Father of Texas<\/b>. His first settlers: the <b>Old Three Hundred<\/b>.", "<b>Martín De León<\/b>: native Mexican empresario; his colony was the only one settled mainly by Mexican families."], "merchant": {"name": "Land office clerk", "icon": "🧑‍💼", "hello": "Looking for land? Here you need a contract first.", "goods": [{"icon": "📜", "name": "Land Grant", "fact": "An empresario was a land agent who brought settlers into Texas in exchange for land. Stephen F. Austin, the Father of Texas, took over the contract of his father Moses Austin. His first settlers were the Old Three Hundred."}, {"icon": "🪓", "name": "Settler's Axe", "fact": "When Spain opened Texas to foreign settlers in 1820, they had to be Catholic (or convert), be hard-working and become citizens. Anglo-Americans came for cheap land and to escape debt."}]}}, {"id": "words", "name": "Word Mill", "biome": "mill", "teach": ["<b>Part 7: Vocabulary.<\/b> <b>militia<\/b>: citizens acting as a military force. <b>centralist<\/b>: power in the national government. <b>federalist<\/b>: power shared between states and national government.", "<b>survey<\/b>: measure the boundaries of land. <b>pioneer<\/b>: travels to unclaimed territory to settle. <b>depression<\/b>: low economic activity, high unemployment.", "<b>diminish<\/b>: become smaller. <b>prime<\/b>: top quality, the best. <b>presidio<\/b>: Spanish fort protecting missions. <b>mission<\/b>: religious settlement run by Catholic priests.", "<b>Anglo American<\/b>: white, English-speaking settler from the United States. <b>land grant<\/b>: land given by a government in exchange for settling it."], "merchant": {"name": "Mill storekeeper", "icon": "🧑‍🍳", "hello": "Words are my trade. Each of these teaches you two.", "goods": [{"icon": "📏", "name": "Surveyor's Rule", "fact": "To survey is to measure the boundaries of land. A land grant is land given by a government in exchange for settling it."}, {"icon": "🏰", "name": "Model Presidio", "fact": "A presidio was a Spanish fort that protected the missions. A mission was a religious settlement run by Catholic priests."}]}}, {"id": "review", "name": "Old Camino Real", "biome": "kennel", "teach": ["<b>Earlier this week.<\/b> Rubí: Spain lacked the <b>wealth<\/b> and <b>power<\/b> to defend all of Texas. The 13 colonies declared independence in <b>1776<\/b>.", "New Orleans was the <b>port<\/b> for Mississippi River trade. <b>Lewis and Clark<\/b> explored the Louisiana Purchase, which made the U.S. Texas's <b>neighbor<\/b>.", "<b>Peter Ellis Bean<\/b> was Nolan's companion, captured by the Spanish. <b>Jean Lafitte<\/b> was the pirate on Galveston Island. <b>Barr<\/b>: NO, he did not fight the government."], "merchant": {"name": "Camino Real peddler", "icon": "🧓", "hello": "I have walked this road all week. I remember everything on it.", "goods": [{"icon": "🦜", "name": "Pirate's Parrot", "fact": "Jean Lafitte was the pirate on Galveston Island. Peter Ellis Bean was Philip Nolan's companion, captured by the Spanish."}, {"icon": "⚓", "name": "New Orleans Anchor", "fact": "New Orleans was the port for Mississippi River trade. Lewis and Clark explored the Louisiana Purchase, which made the United States Texas's neighbor."}]}}, {"id": "clock", "name": "Clock Tower", "biome": "lab", "teach": ["<b>Part 6: Timeline.<\/b> <b>1753<\/b> Father Hidalgo is born. <b>1803<\/b> the Louisiana Purchase. <b>1810<\/b> the Grito de Dolores. <b>1811<\/b> Hidalgo is captured and executed. <b>1821<\/b> Mexico wins independence from Spain.", "Grito to independence: 1821 - 1810 = <b>11 years<\/b>.", "Also: 1763 Seven Years' War ends, 1776 U.S. independence, 1820 Spain opens Texas to settlers, 1821 the Austin contract."], "walls": true, "locked": 2, "merchant": {"name": "Clockmaker", "icon": "🧑‍🔧", "hello": "Tick, tock. Dates are easier when you can hold them.", "goods": [{"icon": "⏳", "name": "Eleven-Year Hourglass", "fact": "From the Grito de Dolores in 1810 to Mexican independence in 1821 is 11 years: 1821 - 1810 = 11."}, {"icon": "📅", "name": "Timeline Calendar", "fact": "In order: 1753 Father Hidalgo is born, 1803 the Louisiana Purchase, 1810 the Grito de Dolores, 1811 Hidalgo is captured and executed, 1821 Mexico wins independence from Spain."}]}}, {"id": "hall", "name": "Hall of the Republic", "biome": "hall", "teach": ["<b>Part 5: Compare.<\/b> <b>Filibusters<\/b> came <b>without permission<\/b> to fight the government for land, power and wealth. The government fought them.", "<b>Empresarios<\/b> came <b>with permission<\/b> and had <b>contracts<\/b> to bring settlers. Mexico welcomed them to help protect Texas."], "walls": true, "locked": 5, "hall": true, "merchant": {"name": "Notary of the Republic", "icon": "🧑‍⚖️", "hello": "Permission is everything. I stamp the papers that prove it.", "goods": [{"icon": "📝", "name": "Stamped Contract", "fact": "Empresarios came with permission and had contracts to bring settlers; Mexico welcomed them to help protect Texas. Filibusters came without permission to fight the government for land, power and wealth."}]}}], "questions": [{"r": "dolores", "topic": "Unhappy with Spain", "q": "Which was a reason Mexicans were unhappy with Spanish rule?", "choices": ["People born in Spain got the best jobs", "Spain refused to collect any taxes", "Spain let Mexicans elect the king", "Spain gave every family free land"], "answer": 0, "explain": "The top jobs in the government and church went to men born in Spain, even though most people in Mexico were born in Mexico.", "review": "Men born in Spain got the best jobs", "variants": [{"q": "In New Spain, who usually got the best government jobs?", "choices": ["Men who were born in Spain", "Men who were born in Mexico", "Anglo Americans", "Filibusters"], "answer": 0}]}, {"r": "dolores", "topic": "Unhappy with Spain", "q": "Why did Spain raise taxes so high in Mexico?", "choices": ["To pay for its wars in Europe", "To build schools in Texas", "To buy Louisiana from France", "To pay Father Hidalgo's army"], "answer": 0, "explain": "Spain was fighting wars in Europe and made its colonies pay for them. Mexicans paid, but got nothing back.", "review": "High taxes paid for wars in Europe", "variants": [{"q": "High taxes made Mexicans angry because the money was spent on...", "choices": ["wars far away in Europe", "roads in Mexico", "the missions in Texas", "the Louisiana Purchase"], "answer": 0}]}, {"r": "dolores", "topic": "Unhappy with Spain", "q": "Mexicans were ruled by a king who lived...", "choices": ["far away in Europe (Spain)", "in Mexico City", "in San Antonio", "in New Orleans"], "answer": 0, "explain": "The king was in Spain, an ocean away. People in Mexico had no say in the rules made for them.", "review": "Ruled by someone far away in Europe", "variants": [{"q": "Three reasons Mexicans were unhappy: Spanish-born men got the best jobs, high taxes for Europe's wars, and...", "choices": ["being ruled by someone far away in Europe", "too many empresarios", "the Louisiana Purchase", "the Old Three Hundred"], "answer": 0}]}, {"r": "dolores", "topic": "Father Hidalgo", "q": "Father Hidalgo was a Catholic ______.", "type": "type", "accept": ["priest", "preist", "father", "padre"], "explain": "Miguel Hidalgo y Costilla was a Catholic priest. That is why he is called Father Hidalgo.", "review": "Hidalgo was a Catholic priest", "variants": [{"q": "What was Father Hidalgo's job?", "choices": ["Catholic priest", "Army general", "Empresario", "Governor of Texas"], "answer": 0}]}, {"r": "dolores", "topic": "Father Hidalgo", "q": "Father Hidalgo was the priest in the town of ______.", "type": "type", "accept": ["Dolores"], "explain": "His town was Dolores. That is where the Grito de Dolores (the Cry of Dolores) gets its name.", "review": "His town: Dolores", "variants": [{"q": "The Grito de Dolores is named after...", "choices": ["the town where Hidalgo was priest", "Hidalgo's sister", "a Spanish general", "a river in Texas"], "answer": 0}]}, {"r": "dolores", "topic": "Father Hidalgo", "q": "Father Hidalgo was born in the year ______.", "type": "type", "accept": ["1753"], "explain": "Hidalgo was born in 1753, so he was 57 when he gave the Grito de Dolores in 1810.", "review": "Hidalgo born 1753", "variants": [{"q": "Father Hidalgo was born in...", "choices": ["1753", "1763", "1803", "1810"], "answer": 0}]}, {"r": "dolores", "topic": "Grito de Dolores", "q": "The Grito de Dolores happened on...", "choices": ["September 16, 1810", "July 4, 1776", "September 16, 1821", "May 5, 1810"], "answer": 0, "explain": "September 16, 1810. Mexico still celebrates September 16 as its Independence Day.", "review": "Grito: September 16, 1810", "variants": [{"q": "In what year was the Grito de Dolores? (number)", "type": "type", "accept": ["1810"]}]}, {"r": "dolores", "topic": "Grito de Dolores", "q": "What was the Grito de Dolores?", "choices": ["Father Hidalgo's call for the people of Mexico to rise up against Spanish rule", "A peace treaty between Spain and Mexico", "A law that let settlers into Texas", "The battle where Hidalgo was captured"], "answer": 0, "explain": "Grito means cry or shout. Hidalgo called on the people to fight for independence from Spain.", "review": "Grito = call to rise against Spain", "variants": [{"q": "'Grito de Dolores' means the Cry of Dolores. Who gave it, and why?", "choices": ["Father Hidalgo, to start the fight against Spanish rule", "Stephen F. Austin, to bring settlers", "The king of Spain, to raise taxes", "James Long, to take Texas"], "answer": 0}]}, {"r": "dolores", "topic": "Hidalgo's army", "q": "Which was a problem that hurt Hidalgo's army?", "choices": ["The soldiers had no military training", "It had too many cannons", "It was too small to be noticed", "Its soldiers came from the United States"], "answer": 0, "explain": "His followers were ordinary people, not trained soldiers. They also lacked discipline and good weapons.", "review": "Army: no military training", "variants": [{"q": "Hida e person wanted land and ______.", "type": "type", "accept": ["power"]}]}, {"r": "filib", "topic": "Four parts of a filibuster", "q": "Part 4: a filibuster wanted personal gain. That means they wanted to get ______.", "type": "type", "accept": ["wealth", "rich", "wealthy", "money", "welth"], "explain": "Personal gain means getting something for yourself: wealth. Fighting to free your people is not personal gain.", "review": "4: personal gain (wealth)", "variants": [{"q": "'Personal gain' means the person wanted...", "choices": ["wealth for themselves", "freedom for everyone", "to help the king", "to become a priest"], "answer": 0}]}, {"r": "filib", "topic": "Four parts of a filibuster", "q": "How many of the four parts must be true for someone to be a filibuster?", "choices": ["All four", "Any one", "Any two", "Three"], "answer": 0, "explain": "All four. If even one part is missing, the answer is NO, and the missing part is your reason.", "review": "Needs all four parts", "variants": [{"q": "A person meets three of the four parts of the definition. Filibuster?", "choices": ["No, all four are needed", "Yes, three is enough", "Yes, if they are foreign", "Only if they won"], "answer": 0}]}, {"r": "filib", "topic": "Filibuster or NO?", "q": "Philip Nolan: filibuster or NO?", "choices": ["Filibuster", "NO"], "answer": 0, "explain": "Nolan was an American who came into Spanish Texas with armed men, without permission. The Spanish treated him as a filibuster and he was killed fighting their soldiers in 1801.", "review": "Philip Nolan: filibuster", "variants": [{"q": "Philip Nolan was from the United States and fought Spanish soldiers in Texas. That makes him...", "choices": ["a filibuster", "an empresario", "a missionary", "a Spanish citizen"], "answer": 0}]}, {"r": "filib", "topic": "Filibuster or NO?", "q": "Augustus Magee: filibuster or NO?", "choices": ["Filibuster", "NO"], "answer": 0, "explain": "Magee was a former U.S. Army officer who helped lead an armed invasion  ov.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{J[b.dataset.k]=!J[b.dataset.k];store.set(JKEY,J);document.body.classList.toggle('rm',J.reduceMotion);Kit.still=J.reduceMotion;Sound.click();settings()});
 $('shk').onclick=()=>{J.shakeScale=J.shakeScale>=1?0:J.shakeScale+.5;store.set(JKEY,J);shake(.6);settings()};$('cl').onclick=hide;$('sw').onclick=()=>{saveRun();title()}}
document.body.classList.toggle('rm',J.reduceMotion);Kit.still=J.reduceMotion;
// ---------- the log of each play, and the prompt that hands it to the notes ----------
const stamp=()=>new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
function download(name,obj){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}catch(e){}}
function record(){const live=Q.map((_,i)=>i).filter(i=>SITE[i]),asked=live.filter(i=>S.log[i]),miss=asked.filter(i=>!S.log[i][0].ok);
 return{studywright_record:1,mode:'world',deck:DECK.id,title:DECK.title,subject:DECK.subject,area:STAT,follows:DECK.follows||null,started:S.started,finished:new Date().toISOString(),elapsed_sec:Math.round((Date.now()-S.t0)/1000),
  score_first_try:asked.length?Math.round(100*(asked.length-miss.length)/asked.length):0,best_streak:S.best,answers:S.answered,questions_total:asked.length,deck_total:live.length,mastered:S.done.length,run_xp:S.xp,keys:S.keys,steps_walked:S.moves,tiles_mapped:S.newTiles,regions_visited:S.route,notes_read:S.read.map(i=>REG[i].id),bought:S.bought||[],gold:hero.inv.gold,
  hero:JSON.parse(JSON.stringify(hero)),
  first_try_misses:miss.map(i=>({n:i+1,topic:Q[i].topic||'',region:REG[SITE[i].r].id,q:Q[i].q,answer:ansOf(Q[i]),tries:S.log[i]})),
  unseen:live.filter(i=>!S.log[i]).map(i=>({n:i+1,topic:Q[i].topic||'',region:REG[SITE[i].r].id})),
  items:live.map(i=>({n:i+1,topic:Q[i].topic||'',region:REG[SITE[i].r].id,tries:(S.log[i]||[]).length,first_ok:!!(S.log[i]&&S.log[i][0].ok),mastered:isDone(i)}))}}
function askFinish(){const left=Q.filter((_,i)=>SITE[i]&&!isDone(i)).length;show(`<div class="card"><h1>🏁 Finish this quest?</h1><p>${left?left+' creature'+(left>1?'s are':' is')+' still waiting. You can finish now and the log will say what was not reached, or keep exploring.':'Everything is mastered.'}</p><div class="row"><button class="go" id="cl">Keep exploring ▶</button><button id="fin">Finish and save the log 💾</button></div></div>`);$('cl').onclick=hide;$('fin').onclick=finish}
function finish(){const R=record(),fname='studywright-'+DECK.id+'-'+stamp()+'.json';S.finished=true;hero.quests=(hero.quests||0)+1;H.put(hero);const all=store.get(RKEY)||[];all.push(R);store.set(RKEY,all.slice(-200));
 const rec=store.get(KEY)||{};store.set(KEY,{score:Math.max(R.score_first_try,rec.score||0),best:Math.max(S.best,rec.best||0),miss:S.firstMiss.slice(),last:new Date().toLocaleDateString('en-CA'),run:null});saveWorld(true);download(fname,R);Sound.win();burst(P.x*TS+TS/2,P.y*TS,['#ffd166','#7bd389','#fff','#4cc9f0'],80);
 const sc=R.score_first_try,stars=sc>=90?3:sc>=70?2:1,topics={};R.first_try_misses.forEach(m=>{(topics[m.topic||'Other']=topics[m.topic||'Other']||[]).push(Q[m.n-1])});
 show(`<div class="card"><h1>Quest complete! ${'⭐'.repeat(stars)}</h1><p><b>${sc}%</b> right on the first try (${R.questions_total-R.first_try_misses.length} of ${R.questions_total}). Mastered <b>${R.mastered}</b> of ${R.deck_total}. Best streak <b>${R.best_streak}</b>. ${esc(hero.name)} earned <b>${S.xp} XP</b>, walked ${S.moves} steps and mapped ${S.newTiles} new tiles.</p>
 ${R.unseen.length?`<p class="small">${R.unseen.length} creature${R.unseen.length>1?'s were':' was'} not reached. Keep exploring to find them.</p>`:''}
 ${R.first_try_misses.length?`<h2>Review these before the test</h2><ul class="rev">${Object.entries(topics).map(([t,qs])=>`<li><b>${esc(t)}</b>: ${qs.map(q=>esc(q.review||q.q)+' → <b>'+esc(ansOf(q))+'</b>').join('<br>')}</li>`).join('')}</ul>`:'<p>Nothing missed on the first try. You are ready.</p>'}
 ${Kit.notesHtml(R,fname)}
 <div class="row"><button id="sv">Save the log again 💾</button><button id="cl">Keep exploring</button><button id="ng">New quest ↻</button></div></div>`);
 Kit.notesWire(R,fname);$('sv').onclick=()=>download(fname,R);$('cl').onclick=hide;$('ng').onclick=()=>{newRun();start()}}
// ---------- title, hero picker and builder ----------
function title(){hero=H.cur();if(!hero)return heroCreate(false);const saved=(store.get(KEY)||{}).run,tot=Q.filter((_,i)=>SITE[i]).length,others=H.all().list.filter(h=>h.id!==hero.id),mine=Object.keys(W.builds).filter(k=>W.builds[k].d===DECK.id).length;
 show(`<div class="card"><h1>${esc(DECK.title)}</h1><p class="small">${esc(DECK.subject)}</p><p>${esc(DECK.intro)}</p>
 <div class="builder"><div class="pv" id="tp"></div><div style="flex:1;min-width:220px"><b>${esc(hero.name)}</b> the ${hero.cls} · Level ${heroLvl(hero)} · ${hero.xp} XP<br><span class="small">❤️ ${hero.inv.hp}/${maxHp(hero)} · 🪙 ${hero.inv.gold} · ${hero.quests||0} quests · ${CLASSES[hero.cls].icon} ${CLASSES[hero.cls].perk}</span>
 <p class="small">The same hero plays every studywright game. The land you map and everything you build here stay for next time${mine?': '+mine+' thing'+(mine>1?'s':'')+' already built in this valley':''}.</p></div></div>
 <div class="choices">${saved?`<button class="go" id="co">▶ Continue the quest (${saved.done.length}/${tot} helped)</button><button id="st">↻ Start the quest over</button>`:'<button class="go" id="st">▶ Start exploring</button>'}
 ${others.map(h=>`<button data-h="${h.id}">Play as ${CLASSES[h.cls].icon} <b>${esc(h.name)}</b> the ${h.cls} · Level ${heroLvl(h)}</button>`).join('')}<button id="ed">🎨 Change how ${esc(hero.name)} looks</button><button id="nh">➕ Make a new hero</button></div>
 <h2>How to play</h2><ul class="rev small"><li>Walk anywhere: up, down, left, right. Water, mountains, trees and walls block you. Roads lead to every region.</li><li>🪧 Signposts teach the notes. Read them first; you can also check them from inside a question.</li><li>Walk into a creature to answer its question. Right: it builds something that stays on the map. Wrong: read why, help someone else, then come back for the same idea in new words.</li><li>Master every creature in a region to earn its 🗝️. Keys open locked doors. Open the trophy chest in the hall to finish.</li>${REG.some(r=>r.merchant)?'<li>💰 Merchants trade your gold for healing potions, a trail map, a compass and keepsakes that each tell a true story.</li>':''}</ul></div>`);
 $('tp').appendChild(heroCanvas(hero,120,150,3.6));
 $('st').onclick=()=>{newRun();start()};if(saved)$('co').onclick=()=>{S=saved;S.t0=Date.now()-(saved.el||0);start(true)};
 ov.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{const d=H.all();d.active=b.dataset.h;H.save(d);Sound.click();title()});$('ed').onclick=()=>heroCreate(true,hero);$('nh').onclick=()=>heroCreate(true)}
function start(resume){hero=H.cur();hide();place(resume?S.x:OX,resume?S.y:OY);if(!resume){saveRun();banner('🧭 '+REG[0].name+'. Read the signpost 🪧 first!')}hud()}
function heroCreate(back,edit){Kit.builder({mount:html=>{show(html);return ov},edit,back:back?title:null,sound:Sound,perks:Object.fromEntries(Object.entries(CLASSES).map(([c,v])=>[c,v.perk])),
 done:r=>{if(edit){edit.look=r.look;H.put(edit)}else H.put(newHero(r.name,r.cls,r.look));Sound.lvl();title()}})}
addEventListener('pagehide',()=>{saveRun();saveWorld(true)});
requestAnimationFrame(frame);title();
</script></body></html>
